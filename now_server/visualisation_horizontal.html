<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing - Horizontal</title>
    <style>
        :root {
            --bg-color: rgba(30, 30, 30, 1);
            --text-color: #ffffff;
            --wave-color: #1db954;
            --accent-color: #1db954;
            --progress-color: #1db954;
            --progress-color1: #1db954;
            --progress-color2: #1ed760;
            --progress-bg: #404040;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: transparent !important;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: var(--justify-content);
            align-items: var(--align-items);
            min-height: 100vh;
            overflow: hidden; /* Предотвращаем прокрутку из-за подсветки */
        }
        
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: var(--align-items);
            width: auto;
        }

        @media screen and (min-width: 1024px) {
            body {
                background: rgba(10, 10, 10, 0.9) !important;
            }
        }

        .player-container {
            background: var(--bg-color);
            border-radius: 16px;
            width: 600px;
            max-width: 90vw;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            opacity: 0;
            overflow: visible; /* Как в visualisation_var3_horizontal.html - подсветка должна быть видна */
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-start;
        }

        /* Эффект стекла для player-container - темное */
        .player-container.glass-effect.glass-dark {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        /* Эффект стекла для player-container - белое */
        .player-container.glass-effect.glass-light {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        .cover-container {
            display: flex;
            flex-direction: column;
            width: 150px;
            min-width: 150px;
            margin-bottom: 0;
            margin-right: 0;
            gap: 10px;
            flex-shrink: 0;
            overflow: visible; /* Разрешаем подсветке выходить за границы */
        }
        .cover-wrapper {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: visible; /* Подсветка должна быть видна */
        }
        .album-cover {
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            border-radius: 8px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: none;
            transition: box-shadow 0.8s ease, opacity 0.6s ease-in-out;
            overflow: hidden;
        }
        .visualizer-full-width {
            width: 100%;
            margin-top: 0;
            padding-top: 0;
            padding-bottom: 0;
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }

        .visualizer-full-width.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }
        .album-cover.active {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }
        .album-cover.inactive {
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }
        .ambient-light {
            position: absolute;
            top: -15px;
            left: -15px;
            right: -15px;
            bottom: -15px;
            border-radius: 8px;
            z-index: 1;
            opacity: 1;
            pointer-events: none;
            filter: blur(12px);
            background: radial-gradient(circle at 50% 20%, 
                var(--ambient-color, rgba(29, 185, 84, 0.85)) 0%,
                transparent 65%);
            animation: ambientPulse 3s ease-in-out infinite;
            transition: background 0.5s ease;
        }
        @keyframes ambientPulse {
            0%, 100% {
                opacity: 0.9;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
        .top-section {
            display: flex;
            flex-direction: row;
            gap: 20px;
            width: 100%;
            align-items: flex-start;
            overflow: visible; /* Разрешаем подсветке выходить за границы */
        }
        .content-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            position: relative;
            z-index: 10; /* Текст должен быть выше подсветки */
        }
        .track-info {
            text-align: left;
            padding: 0;
            overflow: hidden;
            position: relative;
            margin-bottom: 10px;
            z-index: 10; /* Текст должен быть выше подсветки */
        }
        /* Контейнер для бегущей строки */
        .marquee-container {
            overflow: hidden;
            position: relative;
            width: 100%;
        }
        .track-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: normal; /* Изменено с nowrap на normal */
            color: var(--text-color);
            overflow: hidden; /* Убираем прокрутку текста */
            text-overflow: ellipsis; /* Многоточие для длинного текста */
            word-wrap: break-word;
            max-height: none;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Ограничиваем до 2 строк */
            -webkit-box-orient: vertical;
            position: relative;
            z-index: 10; /* Текст должен быть выше подсветки */
        }
        .artist-name {
            font-size: 32px;
            color: var(--text-color);
            opacity: 0.8;
            font-weight: 500;
            margin-bottom: 12px;
            white-space: normal; /* Изменено с nowrap на normal */
            overflow: hidden; /* Убираем прокрутку текста */
            text-overflow: ellipsis; /* Многоточие для длинного текста */
            word-wrap: break-word;
            max-height: none;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Ограничиваем до 2 строк */
            -webkit-box-orient: vertical;
            position: relative;
            z-index: 10; /* Текст должен быть выше подсветки */
        }

        /* ПОЛЗУНОК ПРОГРЕССА */
        .progress-container {
            margin: 15px 0;
            margin-bottom: 0;
        }
        .progress-bar {
            width: 100%;
            height: 15px;
            background: var(--progress-color1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 0px;
            overflow: hidden;
        }
        .progress {
            height: 100%;
            background: var(--progress-color2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s ease;
            position: relative;
        }
        .progress-time {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            color: var(--text-color);
            opacity: 0.7;
            margin-top: 5px;
        }

        .visualizer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 35px;
            margin: 0;
            gap: 2px;
            width: 100%;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease-in, transform 0.3s ease-in;
        }

        .visualizer-bar {
            background: linear-gradient(to top, var(--accent-color), var(--wave-color));
            width: 15px;
            border-radius: 2px 2px 0 0;
            transform-origin: bottom;
            height: 45px;
            opacity: 0.3;
            /* CSS анимация вместо JS - легче для CPU */
            animation: wave-animation 1.5s ease-in-out infinite;
            animation-play-state: paused; /* По умолчанию остановлено */
        }

        .visualizer.enabled .visualizer-bar {
            animation-play-state: running;
        }

        /* Плавное исчезновение при выключении */
        .visualizer.fade-out {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
            pointer-events: none;
        }

        .visualizer.fade-out .visualizer-bar {
            animation-play-state: paused;
        }

        /* CSS анимация визуализатора - хаотичное движение */
        @keyframes wave-animation {
            0%, 100% {
                transform: scaleY(0.067);
                opacity: 0.3;
            }
            20% {
                transform: scaleY(var(--bar-max-1, 0.6));
                opacity: var(--bar-opacity-1, 0.8);
            }
            40% {
                transform: scaleY(var(--bar-max-2, 0.3));
                opacity: var(--bar-opacity-2, 0.5);
            }
            60% {
                transform: scaleY(var(--bar-max-3, 0.9));
                opacity: var(--bar-opacity-3, 1.0);
            }
            80% {
                transform: scaleY(var(--bar-max-4, 0.4));
                opacity: var(--bar-opacity-4, 0.6);
            }
        }

        /* Задержки и длительности устанавливаются JavaScript для хаотичности */

        .status {
            font-size: 11px;
            color: var(--text-color);
            opacity: 0.3;
            text-align: center;
            margin-top: 10px;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="main-content">
        <div class="player-container" id="player">
        <div class="top-section">
            <div class="cover-container">
                <div class="cover-wrapper">
                    <div class="ambient-light" id="ambientLight"></div>
                    <img class="album-cover active" id="cover1" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
                    <img class="album-cover inactive" id="cover2" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
                </div>
            </div>
            <div class="content-section">
            <div class="track-info">
                <div class="marquee-container" id="title-container">
                    <div class="track-title" id="title">Не воспроизводится</div>
                </div>
                <div class="marquee-container" id="artist-container">
                    <div class="artist-name" id="artist">Нет данных</div>
                </div>
            </div>

            <!-- ПОЛЗУНОК ПРОГРЕССА -->
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <div class="progress-time">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            </div>
        </div>
        
        <!-- Визуализатор на всю ширину подложки -->
        <div class="visualizer-full-width">
            <div class="visualizer" id="visualizer"></div>
        </div>
        </div>
        
        <!-- Статус под подложкой -->
        <div class="status" id="status"></div>
    </div>

    <script>
    const player = document.getElementById('player');
    const cover1 = document.getElementById('cover1');
    const cover2 = document.getElementById('cover2');
    let currentCover = cover1;
    let nextCover = cover2;
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const status = document.getElementById('status');
    const visualizer = document.getElementById('visualizer');

    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');

    let ws;
    let reconnectTimer;
    const RECONNECT_DELAY = 3000;
    let currentConfig = {};

    let currentPosition = 0;
    let totalDuration = 0;
    let isPlaying = false;
    let progressInterval;
    
    let currentAmbientColor = null;
    let previousAmbientColor = null;
    let colorTransitionAnimation = null;
    let lastActiveTimestamp = 0;
    let noCoverTimeout = null;
    let colorExtractionTimeout = null;
    let pendingCoverUrl = null;

    // Кеш для результатов извлечения цветов
    window.colorCache = new Map();
    const colorCache = window.colorCache;
    
    // Статистика производительности
    window.performanceStats = {
        colorExtractions: 0,
        totalTime: 0,
        maxTime: 0,
        minTime: Infinity,
        cacheHits: 0
    };
    const performanceStats = window.performanceStats;
    
    function logPerformance(operation, duration) {
        if (window.DEBUG_PERFORMANCE) {
            console.log(`[PERF] ${operation}: ${duration.toFixed(2)}ms`);
        }
    }
    
    function getColorAtPoint(imageData, x, y, width) {
        const index = (y * width + x) * 4;
        return {
            r: imageData.data[index],
            g: imageData.data[index + 1],
            b: imageData.data[index + 2],
            a: imageData.data[index + 3]
        };
    }

    function getEdgeColors(image, trackTitle = null, trackArtist = null) {
        return new Promise((resolve, reject) => {
            const startTime = performance.now();
            
            try {
                if (!image || !image.complete || image.naturalWidth === 0) {
                    reject(new Error('Изображение не загружено'));
                    return;
                }

                const fullUrl = image.src;
                const cacheKey = trackTitle && trackArtist 
                    ? `edges_${fullUrl}|${trackTitle}|${trackArtist}` 
                    : `edges_${fullUrl}`;
                
                if (colorCache.has(cacheKey)) {
                    performanceStats.cacheHits++;
                    const cachedResult = colorCache.get(cacheKey);
                    logPerformance('getEdgeColors (CACHED)', performance.now() - startTime);
                    resolve(cachedResult);
                    return;
                }
                
                performanceStats.colorExtractions++;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = 100;
                canvas.width = size;
                canvas.height = size;
                
                ctx.drawImage(image, 0, 0, size, size);
                const imageData = ctx.getImageData(0, 0, size, size);
                
                const edges = {
                    left: [
                        getColorAtPoint(imageData, 0, 0, size),
                        getColorAtPoint(imageData, 0, Math.floor(size / 2), size),
                        getColorAtPoint(imageData, 0, size - 1, size)
                    ],
                    bottom: [
                        getColorAtPoint(imageData, 0, size - 1, size),
                        getColorAtPoint(imageData, Math.floor(size / 2), size - 1, size),
                        getColorAtPoint(imageData, size - 1, size - 1, size)
                    ],
                    right: [
                        getColorAtPoint(imageData, size - 1, size - 1, size),
                        getColorAtPoint(imageData, size - 1, Math.floor(size / 2), size),
                        getColorAtPoint(imageData, size - 1, 0, size)
                    ],
                    top: [
                        getColorAtPoint(imageData, size - 1, 0, size),
                        getColorAtPoint(imageData, Math.floor(size / 2), 0, size),
                        getColorAtPoint(imageData, 0, 0, size)
                    ]
                };
                
                const result = {
                    top: edges.top.map(c => `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`),
                    right: edges.right.map(c => `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`),
                    bottom: edges.bottom.map(c => `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`),
                    left: edges.left.map(c => `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`)
                };
                
                if (colorCache.size >= 50) {
                    const firstKey = colorCache.keys().next().value;
                    colorCache.delete(firstKey);
                }
                colorCache.set(cacheKey, result);
                
                const duration = performance.now() - startTime;
                performanceStats.totalTime += duration;
                performanceStats.maxTime = Math.max(performanceStats.maxTime, duration);
                performanceStats.minTime = Math.min(performanceStats.minTime, duration);
                
                logPerformance('getEdgeColors', duration);
                
                resolve(result);
            } catch (error) {
                console.error('Ошибка в getEdgeColors:', error);
                reject(error);
            }
        });
    }


    function updateProgress() {
        if (totalDuration > 0) {
            const progressPercent = (currentPosition / totalDuration) * 100;
            progress.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentPosition);
            durationEl.textContent = formatTime(totalDuration);
        } else {
            progress.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';
        }
    }

    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function startProgressUpdate() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (isPlaying && currentPosition < totalDuration) {
                currentPosition += 1;
                updateProgress();
            }
        }, 1000);
    }

    function stopProgressUpdate() {
        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }
    }

    function getDominantColors(image, trackTitle = null, trackArtist = null) {
        return new Promise((resolve, reject) => {
            const startTime = performance.now();
            
            try {
                if (!image || !image.complete || image.naturalWidth === 0) {
                    reject(new Error('Изображение не загружено'));
                    return;
                }

                const fullUrl = image.src;
                const cacheKey = trackTitle && trackArtist 
                    ? `${fullUrl}|${trackTitle}|${trackArtist}` 
                    : fullUrl;
                
                if (colorCache.has(cacheKey)) {
                    performanceStats.cacheHits++;
                    const cachedResult = colorCache.get(cacheKey);
                    logPerformance('getDominantColors (CACHED)', performance.now() - startTime);
                    resolve(cachedResult);
                    return;
                }
                
                performanceStats.colorExtractions++;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = 80;
                canvas.width = size;
                canvas.height = size;
                
                ctx.drawImage(image, 0, 0, size, size);
                const imageData = ctx.getImageData(0, 0, size, size);
                const data = imageData.data;
                
                const colorMap = new Map();
                
                for (let i = 0; i < data.length; i += 32) {
                    const alpha = data[i + 3];
                    if (alpha > 10) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        const roundedR = Math.round(r / 16) * 16;
                        const roundedG = Math.round(g / 16) * 16;
                        const roundedB = Math.round(b / 16) * 16;
                        const key = `${roundedR},${roundedG},${roundedB}`;
                        
                        if (!colorMap.has(key)) {
                            colorMap.set(key, { r: 0, g: 0, b: 0, count: 0 });
                        }
                        const color = colorMap.get(key);
                        color.r += r;
                        color.g += g;
                        color.b += b;
                        color.count++;
                    }
                }
                
                if (colorMap.size === 0) {
                    reject(new Error('Не удалось извлечь данные'));
                    return;
                }
                
                const colors = Array.from(colorMap.entries()).map(([key, value]) => {
                    const r = Math.round(value.r / value.count);
                    const g = Math.round(value.g / value.count);
                    const b = Math.round(value.b / value.count);
                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                    const hue = getHue(r, g, b);
                    return { r, g, b, count: value.count, luminance, hue };
                });
                
                const nonGrayColors = colors.filter(c => !isColorGray(c.r, c.g, c.b, 30));
                const colorsToFilter = nonGrayColors.length >= 2 ? nonGrayColors : colors;
                const lightColors = colorsToFilter.filter(c => c.luminance >= 100);
                let filteredColors = lightColors.length >= 2 ? lightColors : colorsToFilter.filter(c => c.luminance >= 70 && !isColorGray(c.r, c.g, c.b, 30));
                
                if (filteredColors.length < 2) {
                    filteredColors = colorsToFilter.filter(c => c.luminance >= 50 && !isColorGray(c.r, c.g, c.b, 30));
                }
                if (filteredColors.length < 2) {
                    filteredColors = colorsToFilter.filter(c => c.luminance >= 30 && !isColorGray(c.r, c.g, c.b, 30));
                }
                if (filteredColors.length === 0) {
                    filteredColors = colorsToFilter.length > 0 ? colorsToFilter : colors;
                }
                
                filteredColors.sort((a, b) => b.count - a.count);
                
                let firstColor = filteredColors[0];
                const veryLightColors = filteredColors.filter(c => c.luminance >= 100);
                if (veryLightColors.length > 0) {
                    firstColor = veryLightColors[0];
                }
                
                let secondColor = filteredColors[1] || filteredColors[0];
                
                if (filteredColors.length > 1) {
                    const firstHue = firstColor.hue;
                    const minHueDifference = 30;
                    const minContrast = 120;
                    const isFirstRedPink = isRedOrPink(firstHue);
                    
                    let lightColorsWithDifferentHue = filteredColors.filter(c => {
                        if (c === firstColor) return false;
                        if (isFirstRedPink && isRedOrPink(c.hue)) return false;
                        if (isFirstRedPink) {
                            const hueDiff = Math.abs(c.hue - firstHue);
                            const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                            if (actualHueDiff < 90) return false;
                        }
                        const hueDiff = Math.abs(c.hue - firstHue);
                        const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                        return c.luminance >= 100 && actualHueDiff >= minHueDifference;
                    });
                    
                    if (lightColorsWithDifferentHue.length > 0) {
                        lightColorsWithDifferentHue.sort((a, b) => {
                            return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                        });
                        secondColor = lightColorsWithDifferentHue[0];
                    } else {
                        const lightContrasting = filteredColors.filter(c => {
                            if (c === firstColor) return false;
                            if (isFirstRedPink && isRedOrPink(c.hue)) return false;
                            if (isFirstRedPink) {
                                const hueDiff = Math.abs(c.hue - firstHue);
                                const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                                if (actualHueDiff < 90) return false;
                            }
                            const hueDiff = Math.abs(c.hue - firstHue);
                            const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                            return c.luminance >= 100 && actualHueDiff >= 15 && colorDistance(firstColor, c) >= minContrast;
                        });
                        
                        if (lightContrasting.length > 0) {
                            lightContrasting.sort((a, b) => {
                                return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                            });
                            secondColor = lightContrasting[0];
                        } else {
                            const allLight = filteredColors.filter(c => {
                                if (c.luminance < 100 || c === firstColor) return false;
                                if (isFirstRedPink && isRedOrPink(c.hue)) return false;
                                if (isFirstRedPink) {
                                    const hueDiff = Math.abs(c.hue - firstHue);
                                    const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                                    if (actualHueDiff < 90) return false;
                                }
                                return true;
                            });
                            if (allLight.length > 0) {
                                allLight.sort((a, b) => {
                                    return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                                });
                                secondColor = allLight[0];
                            }
                        }
                    }
                    
                    const finalHueDiff = Math.abs(secondColor.hue - firstHue);
                    const actualFinalHueDiff = finalHueDiff > 180 ? 360 - finalHueDiff : finalHueDiff;
                    
                    if (actualFinalHueDiff < 20 && filteredColors.length > 2) {
                        const oppositeHue = (firstHue + 180) % 360;
                        const colorsNearOpposite = filteredColors.filter(c => {
                            if (c === firstColor) return false;
                            if (isFirstRedPink && isRedOrPink(c.hue)) return false;
                            if (isFirstRedPink) {
                                const hueDiff = Math.abs(c.hue - firstHue);
                                const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                                if (actualHueDiff < 90) return false;
                            }
                            const hueDiff = Math.abs(c.hue - oppositeHue);
                            const actualDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                            return actualDiff < 60 && c.luminance >= 70;
                        });
                        
                        if (colorsNearOpposite.length > 0) {
                            colorsNearOpposite.sort((a, b) => b.luminance - a.luminance);
                            secondColor = colorsNearOpposite[0];
                        }
                    }
                }
                
                const isFirstRedPinkFinal = isRedOrPink(firstColor.hue);
                const isSecondRedPinkFinal = isRedOrPink(secondColor.hue);
                
                if (isFirstRedPinkFinal && isSecondRedPinkFinal) {
                    const alternativeColors = filteredColors.filter(c => {
                        if (c === firstColor) return false;
                        return !isRedOrPink(c.hue);
                    });
                    
                    if (alternativeColors.length > 0) {
                        alternativeColors.sort((a, b) => {
                            return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                        });
                        secondColor = alternativeColors[0];
                    } else {
                        const nonRedPink = filteredColors.filter(c => {
                            if (c === firstColor) return false;
                            const hueDiff = Math.abs(c.hue - firstColor.hue);
                            const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                            return actualHueDiff > 60;
                        });
                        
                        if (nonRedPink.length > 0) {
                            nonRedPink.sort((a, b) => {
                                return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                            });
                            secondColor = nonRedPink[0];
                        }
                    }
                }
                
                const result = {
                    first: `rgba(${firstColor.r}, ${firstColor.g}, ${firstColor.b}, 0.85)`,
                    second: `rgba(${secondColor.r}, ${secondColor.g}, ${secondColor.b}, 0.85)`
                };
                
                if (colorCache.size >= 50) {
                    const firstKey = colorCache.keys().next().value;
                    colorCache.delete(firstKey);
                }
                colorCache.set(cacheKey, result);
                
                const duration = performance.now() - startTime;
                performanceStats.totalTime += duration;
                performanceStats.maxTime = Math.max(performanceStats.maxTime, duration);
                performanceStats.minTime = Math.min(performanceStats.minTime, duration);
                
                logPerformance('getDominantColors', duration);
                
                if (performanceStats.colorExtractions % 10 === 0) {
                    const avgTime = performanceStats.totalTime / performanceStats.colorExtractions;
                    console.log(`[PERF STATS] Извлечений: ${performanceStats.colorExtractions}, ` +
                              `Кеш попаданий: ${performanceStats.cacheHits}, ` +
                              `Среднее время: ${avgTime.toFixed(2)}ms, ` +
                              `Макс: ${performanceStats.maxTime.toFixed(2)}ms, ` +
                              `Мин: ${performanceStats.minTime.toFixed(2)}ms`);
                }
                
                resolve(result);
            } catch (error) {
                console.error('Ошибка в getDominantColors:', error);
                reject(error);
            }
        });
    }

    function getDominantColor(image) {
        return getDominantColors(image).then(colors => colors.first);
    }

    function lightenColor(color, amount = 30) {
        const rgb = parseColor(color);
        const r = Math.min(255, rgb.r + amount);
        const g = Math.min(255, rgb.g + amount);
        const b = Math.min(255, rgb.b + amount);
        return `rgba(${r}, ${g}, ${b}, 0.85)`;
    }

    function darkenColor(color, amount = 30) {
        const rgb = parseColor(color);
        const r = Math.max(0, rgb.r - amount);
        const g = Math.max(0, rgb.g - amount);
        const b = Math.max(0, rgb.b - amount);
        return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    function desaturateColor(color, factor = 0.5) {
        const rgb = parseColor(color);
        const luminance = Math.round(0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        const r = Math.round(rgb.r * factor + luminance * (1 - factor));
        const g = Math.round(rgb.g * factor + luminance * (1 - factor));
        const b = Math.round(rgb.b * factor + luminance * (1 - factor));
        return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    function isColorDark(color, threshold = 128) {
        const rgb = parseColor(color);
        const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        return luminance < threshold;
    }

    function isColorGray(r, g, b, threshold = 30) {
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;
        return delta < threshold;
    }

    function isRedOrPink(hue) {
        return (hue >= 280 && hue <= 360) || (hue >= 0 && hue <= 50);
    }

    function getHue(r, g, b) {
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;
        
        if (delta === 0) return 0;
        
        let hue = 0;
        if (max === r) {
            hue = ((g - b) / delta) % 6;
        } else if (max === g) {
            hue = (b - r) / delta + 2;
        } else {
            hue = (r - g) / delta + 4;
        }
        
        hue = Math.round(hue * 60);
        if (hue < 0) hue += 360;
        return hue;
    }

    function colorDistance(color1, color2) {
        const rgb1 = typeof color1 === 'object' ? color1 : parseColor(color1);
        const rgb2 = typeof color2 === 'object' ? color2 : parseColor(color2);
        
        const dr = rgb1.r - rgb2.r;
        const dg = rgb1.g - rgb2.g;
        const db = rgb1.b - rgb2.b;
        
        const lum1 = 0.299 * rgb1.r + 0.587 * rgb1.g + 0.114 * rgb1.b;
        const lum2 = 0.299 * rgb2.r + 0.587 * rgb2.g + 0.114 * rgb2.b;
        const dlum = Math.abs(lum1 - lum2);
        
        const hue1 = getHue(rgb1.r, rgb1.g, rgb1.b);
        const hue2 = getHue(rgb2.r, rgb2.g, rgb2.b);
        let hueDiff = Math.abs(hue1 - hue2);
        if (hueDiff > 180) hueDiff = 360 - hueDiff;
        
        return Math.sqrt(dr * dr + dg * dg + db * db) + dlum * 2 + hueDiff * 3;
    }

    function ensureLightColor(color, minLuminance = 180) {
        const rgb = parseColor(color);
        const currentLuminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        
        if (currentLuminance < minLuminance) {
            const scale = minLuminance / (currentLuminance || 1);
            const r = Math.min(255, Math.round(rgb.r * scale));
            const g = Math.min(255, Math.round(rgb.g * scale));
            const b = Math.min(255, Math.round(rgb.b * scale));
            return `rgba(${r}, ${g}, ${b}, 0.85)`;
        }
        
        return color;
    }

    function parseColor(color) {
        let r, g, b;
        
        if (color.startsWith('rgba(')) {
            const rgb = color.replace('rgba(', '').replace(')', '').split(',');
            r = parseInt(rgb[0].trim());
            g = parseInt(rgb[1].trim());
            b = parseInt(rgb[2].trim());
        } else if (color.startsWith('#')) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(color);
            if (result) {
                r = parseInt(result[1], 16);
                g = parseInt(result[2], 16);
                b = parseInt(result[3], 16);
            } else {
                r = 29; g = 185; b = 84;
            }
        } else {
            r = 29; g = 185; b = 84;
        }
        
        return { r, g, b };
    }

    function transitionAmbientLight(fromColor, toColor, duration = 800) {
        if (colorTransitionAnimation) {
            cancelAnimationFrame(colorTransitionAnimation);
        }
        
        const fromRGB = parseColor(fromColor);
        const toRGB = parseColor(toColor);
        
        const startTime = performance.now();
        const deltaR = toRGB.r - fromRGB.r;
        const deltaG = toRGB.g - fromRGB.g;
        const deltaB = toRGB.b - fromRGB.b;
        
        function animate(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            const easeProgress = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            const currentR = Math.round(fromRGB.r + deltaR * easeProgress);
            const currentG = Math.round(fromRGB.g + deltaG * easeProgress);
            const currentB = Math.round(fromRGB.b + deltaB * easeProgress);
            
            const colorString = `rgba(${currentR}, ${currentG}, ${currentB}, 0.85)`;
            
            if (currentConfig.ambient_light_enabled === false) {
                return;
            }
            
            document.documentElement.style.setProperty('--ambient-color', colorString);
            
            if (cover1) {
                cover1.style.boxShadow = `
                    0 0 25px rgba(${currentR}, ${currentG}, ${currentB}, 0.8),
                    0 0 45px rgba(${currentR}, ${currentG}, ${currentB}, 0.6),
                    0 0 65px rgba(${currentR}, ${currentG}, ${currentB}, 0.4)
                `;
            }
            if (cover2) {
                cover2.style.boxShadow = `
                    0 0 25px rgba(${currentR}, ${currentG}, ${currentB}, 0.8),
                    0 0 45px rgba(${currentR}, ${currentG}, ${currentB}, 0.6),
                    0 0 65px rgba(${currentR}, ${currentG}, ${currentB}, 0.4)
                `;
            }
            
            if (progress < 1) {
                colorTransitionAnimation = requestAnimationFrame(animate);
            } else {
                colorTransitionAnimation = null;
                currentAmbientColor = colorString;
                previousAmbientColor = colorString;
            }
        }
        
        colorTransitionAnimation = requestAnimationFrame(animate);
    }

    function updateAmbientLight(edgeColors, useTransition = true) {
        if (currentConfig.ambient_light_enabled === false) {
            return;
        }
        
        if (edgeColors && edgeColors.top) {
            document.documentElement.style.setProperty('--ambient-top-1', edgeColors.top[0]);
            document.documentElement.style.setProperty('--ambient-top-2', edgeColors.top[1]);
            document.documentElement.style.setProperty('--ambient-top-3', edgeColors.top[2]);
            
            document.documentElement.style.setProperty('--ambient-right-1', edgeColors.right[0]);
            document.documentElement.style.setProperty('--ambient-right-2', edgeColors.right[1]);
            document.documentElement.style.setProperty('--ambient-right-3', edgeColors.right[2]);
            
            document.documentElement.style.setProperty('--ambient-bottom-1', edgeColors.bottom[0]);
            document.documentElement.style.setProperty('--ambient-bottom-2', edgeColors.bottom[1]);
            document.documentElement.style.setProperty('--ambient-bottom-3', edgeColors.bottom[2]);
            
            document.documentElement.style.setProperty('--ambient-left-1', edgeColors.left[0]);
            document.documentElement.style.setProperty('--ambient-left-2', edgeColors.left[1]);
            document.documentElement.style.setProperty('--ambient-left-3', edgeColors.left[2]);
            
            if (cover1) cover1.style.boxShadow = 'none';
            if (cover2) cover2.style.boxShadow = 'none';
        }
    }

    function applyAutoColors(colors, edgeColors) {
        if (!currentConfig.auto_colors_enabled) {
            return;
        }

        if (edgeColors) {
            updateAmbientLight(edgeColors, false);
        }

        const firstColorRGB = parseColor(colors.first);
        let firstLuminance = (0.299 * firstColorRGB.r + 0.587 * firstColorRGB.g + 0.114 * firstColorRGB.b);
        
        let bgColorToUse = colors.first;
        if (firstLuminance < 50) {
            bgColorToUse = colors.second;
            const secondColorRGB = parseColor(colors.second);
            firstLuminance = (0.299 * secondColorRGB.r + 0.587 * secondColorRGB.g + 0.114 * secondColorRGB.b);
        }
        
        let bgColorRGB = parseColor(bgColorToUse);
        if (firstLuminance > 120) {
            const darkenAmount = Math.min(100, Math.round((firstLuminance - 120) * 0.8));
            bgColorRGB = parseColor(darkenColor(bgColorToUse, darkenAmount));
        } else if (firstLuminance > 80) {
            bgColorRGB = parseColor(darkenColor(bgColorToUse, 40));
        } else if (firstLuminance > 50) {
            bgColorRGB = parseColor(darkenColor(bgColorToUse, 20));
        }
        
        const desaturatedBg = desaturateColor(`rgba(${bgColorRGB.r}, ${bgColorRGB.g}, ${bgColorRGB.b}, 1)`, 0.5);
        document.documentElement.style.setProperty('--bg-color', desaturatedBg);

        let accentColorLight = lightenColor(colors.second);
        accentColorLight = ensureLightColor(accentColorLight, 180);
        const accentRGB = parseColor(accentColorLight);
        
        document.documentElement.style.setProperty('--text-color', `rgba(${accentRGB.r}, ${accentRGB.g}, ${accentRGB.b}, 1)`);
        document.documentElement.style.setProperty('--wave-color', accentColorLight);
        document.documentElement.style.setProperty('--accent-color', accentColorLight);
        document.documentElement.style.setProperty('--progress-color2', accentColorLight);
        
        const artistElement = document.getElementById('artist');
        if (artistElement) {
            artistElement.style.color = '';
        }
        
        const progressBgColor = darkenColor(colors.second, 60);
        document.documentElement.style.setProperty('--progress-color1', progressBgColor);
        document.documentElement.style.setProperty('--progress-bg', progressBgColor);
    }

    function applyConfig(config) {
        if (config) {
            const wasAutoColorsEnabled = currentConfig.auto_colors_enabled;
            currentConfig = config;

            if (!config.auto_colors_enabled) {
                document.documentElement.style.setProperty('--bg-color', config.main_color || 'rgba(30, 30, 30, 1)');
                document.documentElement.style.setProperty('--accent-color', config.accent_color || '#1db954');
                document.documentElement.style.setProperty('--text-color', config.text_color || '#ffffff');
                document.documentElement.style.setProperty('--wave-color', config.wave_color || '#1db954');
                document.documentElement.style.setProperty('--progress-color', config.progress_color || '#1db954');
                document.documentElement.style.setProperty('--progress-color1', config.progress_color1 || config.progress_color || config.accent_color || config.wave_color || '#1db954');
                document.documentElement.style.setProperty('--progress-color2', config.progress_color2 || config.progress_color || '#1ed760');
                document.documentElement.style.setProperty('--progress-bg', config.progress_bg_color || '#404040');
            } else {
                // Если автоматические цвета включены и только что были включены (были выключены)
                // Пересчитываем цвета из текущей обложки
                if (!wasAutoColorsEnabled && config.auto_colors_enabled) {
                    // Проверяем, есть ли загруженная обложка
                    const activeCover = currentCover && currentCover.src && currentCover.complete && currentCover.naturalWidth > 0 ? currentCover : null;
                    if (activeCover && !activeCover.src.includes('NoCover') && !activeCover.src.includes('/no_cover')) {
                        console.log('Автоматические цвета включены, пересчитываем цвета из текущей обложки');
                        
                        const currentTitle = title ? title.textContent : null;
                        const currentArtist = artist ? artist.textContent : null;
                        
                        Promise.all([
                            getDominantColors(activeCover, currentTitle, currentArtist),
                            getEdgeColors(activeCover, currentTitle, currentArtist)
                        ])
                            .then(([colors, edgeColors]) => {
                                console.log('Применяем автоматические цвета из текущей обложки:', { colors, edgeColors });
                                applyAutoColors(colors, edgeColors);
                            })
                            .catch(error => {
                                console.error('Не удалось извлечь цвета из обложки:', error);
                            });
                    }
                }
            }
            
            document.documentElement.style.setProperty('--align-items', config.align_items || 'flex-end');
            document.documentElement.style.setProperty('--justify-content', config.justify_content || 'flex-end');
            
            const ambientLightEnabled = config.ambient_light_enabled !== false;
            const ambientLight = document.getElementById('ambientLight');
            if (ambientLight) {
                ambientLight.style.display = ambientLightEnabled ? 'block' : 'none';
            }
            
            if (!ambientLightEnabled) {
                if (cover1) cover1.style.boxShadow = 'none';
                if (cover2) cover2.style.boxShadow = 'none';
            }


            if (config.wave_enabled) {
                animateVisualizer();
            } else {
                stopVisualizer();
            }

            // Управление эффектом стекла
            if (config.glass_effect_enabled) {
                player.classList.add('glass-effect');
                // Применяем тип эффекта (темное или белое)
                const glassType = config.glass_effect_type || 'dark';
                player.classList.remove('glass-dark', 'glass-light');
                player.classList.add(`glass-${glassType}`);
            } else {
                player.classList.remove('glass-effect', 'glass-dark', 'glass-light');
            }
        }
    }

    // Создаём 30 полосок визуализатора с хаотичными параметрами анимации
    function createVisualizer() {
        visualizer.innerHTML = '';
        for (let i = 0; i < 30; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar';
            
            // Случайная задержка от 0 до 2 секунд для хаотичности
            const randomDelay = Math.random() * 2;
            // Случайная длительность от 0.8 до 2 секунд для разной скорости
            const randomDuration = 0.8 + Math.random() * 1.2;
            
            // Случайные максимальные высоты для каждой точки анимации (0.3 - 1.0)
            const max1 = 0.3 + Math.random() * 0.7;
            const max2 = 0.3 + Math.random() * 0.7;
            const max3 = 0.3 + Math.random() * 0.7;
            const max4 = 0.3 + Math.random() * 0.7;
            
            // Случайная прозрачность для каждой точки
            const opacity1 = 0.5 + Math.random() * 0.5;
            const opacity2 = 0.4 + Math.random() * 0.4;
            const opacity3 = 0.6 + Math.random() * 0.4;
            const opacity4 = 0.5 + Math.random() * 0.3;
            
            bar.style.animationDelay = `${randomDelay.toFixed(2)}s`;
            bar.style.animationDuration = `${randomDuration.toFixed(2)}s`;
            bar.style.setProperty('--bar-max-1', max1.toFixed(3));
            bar.style.setProperty('--bar-max-2', max2.toFixed(3));
            bar.style.setProperty('--bar-max-3', max3.toFixed(3));
            bar.style.setProperty('--bar-max-4', max4.toFixed(3));
            bar.style.setProperty('--bar-opacity-1', opacity1.toFixed(2));
            bar.style.setProperty('--bar-opacity-2', opacity2.toFixed(2));
            bar.style.setProperty('--bar-opacity-3', opacity3.toFixed(2));
            bar.style.setProperty('--bar-opacity-4', opacity4.toFixed(2));
            
            visualizer.appendChild(bar);
        }
    }

    // Запуск/остановка CSS анимации визуализатора (0% CPU нагрузка!)
    function animateVisualizer() {
        // Проверяем настройки первым делом
        if (currentConfig && currentConfig.wave_enabled === false) {
            stopVisualizer();
            return;
        }
        
        // Находим родительский контейнер (visualizer-full-width)
        const visualizerContainer = visualizer.closest('.visualizer-full-width');
        
        // Убираем класс fade-out
        visualizer.classList.remove('fade-out');
        if (visualizerContainer) {
            visualizerContainer.classList.remove('fade-out');
        }
        
        // Показываем визуализатор, если он скрыт
        const wasHidden = visualizer.style.display === 'none' || (visualizerContainer && visualizerContainer.style.display === 'none');
        if (wasHidden) {
            visualizer.style.display = '';
            if (visualizerContainer) {
                visualizerContainer.style.display = '';
            }
            // Используем requestAnimationFrame для гарантии применения display
            requestAnimationFrame(() => {
            visualizer.classList.add('enabled');
            });
        } else {
            // Если уже видим, сразу добавляем класс
            visualizer.classList.add('enabled');
        }
    }

    // Остановка анимации с плавным исчезновением
    function stopVisualizer() {
        // Убираем класс enabled, чтобы остановить основную анимацию
        visualizer.classList.remove('enabled');
        
        // Находим родительский контейнер (visualizer-full-width)
        const visualizerContainer = visualizer.closest('.visualizer-full-width');
        
        // Если визуализатор видим, добавляем класс fade-out для плавного исчезновения
        if (visualizer.style.display !== 'none') {
            visualizer.classList.add('fade-out');
            if (visualizerContainer) {
                visualizerContainer.classList.add('fade-out');
            }
            
            // После завершения анимации скрываем визуализатор полностью
            setTimeout(() => {
                visualizer.style.display = 'none';
                visualizer.classList.remove('fade-out');
                if (visualizerContainer) {
                    visualizerContainer.style.display = 'none';
                    visualizerContainer.classList.remove('fade-out');
                }
            }, 400); // Длительность анимации исчезновения
        }
    }

    function setStatus(text) {
        status.textContent = text;
    }

    function updatePlayer(data) {
        const messageTimestamp = Date.now();
        
        if (data.status === 'inactive') {
            // Защита от устаревших inactive сообщений после быстрого переключения треков
            if (lastActiveTimestamp > 0 && (messageTimestamp - lastActiveTimestamp) < 2000) {
                console.log('Игнорируем устаревшее inactive сообщение после активного трека');
                return;
            }
            
            // Отменяем предыдущий таймер, если он был
            if (noCoverTimeout) {
                clearTimeout(noCoverTimeout);
                noCoverTimeout = null;
            }
            
            // Задержка перед показом NoCover.png (даем время новому треку загрузиться)
            noCoverTimeout = setTimeout(() => {
                // Проверяем еще раз, возможно, за это время пришел новый трек
                if (lastActiveTimestamp > 0 && (Date.now() - lastActiveTimestamp) < 3000) {
                    console.log('Новый трек загрузился, отменяем показ NoCover');
                    return;
                }
                
                title.textContent = "Плеер не обнаружен";
                artist.textContent = "Запустите медиа-плеер";
                const defaultCoverSrc = '/songinfo/NoCover.png';
                if (currentCover) currentCover.src = defaultCoverSrc;
                if (nextCover && nextCover !== currentCover) nextCover.src = defaultCoverSrc;
                stopVisualizer();
                stopProgressUpdate();

                currentPosition = 0;
                totalDuration = 0;
                isPlaying = false;
                updateProgress();

                lastActiveTimestamp = 0;
                noCoverTimeout = null;
            }, 1500); // Задержка 1.5 секунды перед показом NoCover
            return;
        }
        
        // Обновляем timestamp при активном сообщении
        lastActiveTimestamp = messageTimestamp;
        
        // Отменяем таймер показа NoCover, если активный трек пришел
        if (noCoverTimeout) {
            clearTimeout(noCoverTimeout);
            noCoverTimeout = null;
        }

        title.textContent = data.title || "Неизвестный трек";
        artist.textContent = data.artist || "Неизвестный исполнитель";

        if (data.position !== undefined) currentPosition = data.position;
        if (data.duration !== undefined) totalDuration = data.duration;
        if (data.is_playing !== undefined) {
            isPlaying = data.is_playing;
            if (isPlaying) {
                startProgressUpdate();
            } else {
                stopProgressUpdate();
            }
        }

        updateProgress();

        if (data.cover_url) {
            if (currentAmbientColor) {
                previousAmbientColor = currentAmbientColor;
            }
            
            const loadingCover = nextCover;
            const isFirstLoad = !currentCover.src || currentCover.src.includes('data:image/svg');
            
            loadingCover.classList.remove('active');
            loadingCover.classList.add('inactive');
            
            loadingCover.onload = null;
            loadingCover.onerror = null;
            
            loadingCover.onload = function() {
                if (colorExtractionTimeout) clearTimeout(colorExtractionTimeout);
                
                colorExtractionTimeout = setTimeout(() => {
                    colorExtractionTimeout = null;
                    if (activeCoverLoadId !== loadId) return;
                    
                    const extractColors = () => {
                        const trackTitle = title ? title.textContent : null;
                        const trackArtist = artist ? artist.textContent : null;
                        
                        Promise.all([
                            getDominantColors(loadingCover, trackTitle, trackArtist),
                            getEdgeColors(loadingCover, trackTitle, trackArtist)
                        ])
                            .then(([colors, edgeColors]) => {
                                if (activeCoverLoadId !== loadId) return;
                                console.log('Применяем цвета из изображения:', { colors, edgeColors });
                                
                                if (currentConfig.auto_colors_enabled) {
                                    applyAutoColors(colors, edgeColors);
                                } else {
                                    updateAmbientLight(edgeColors, false);
                                }
                            })
                            .catch(error => {
                                console.error('Не удалось извлечь цвета:', error);
                            });
                    };
                    
                    if (window.requestIdleCallback) {
                        requestIdleCallback(extractColors, { timeout: 100 });
                    } else {
                        setTimeout(extractColors, 0);
                    }
                }, 50);
                
                if (isFirstLoad) {
                    loadingCover.classList.remove('inactive');
                    loadingCover.classList.add('active');
                    if (currentCover !== loadingCover) {
                        currentCover.classList.remove('active');
                        currentCover.classList.add('inactive');
                    }
                    currentCover = loadingCover;
                    nextCover = (loadingCover === cover1) ? cover2 : cover1;
                } else {
                    loadingCover.classList.remove('inactive');
                    loadingCover.classList.add('active');
                    currentCover.classList.remove('active');
                    currentCover.classList.add('inactive');
                    
                    const temp = currentCover;
                    currentCover = nextCover;
                    nextCover = temp;
                }
            };
            
            loadingCover.onerror = () => {
                loadingCover.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjMzMzIi8+PHRleHQgeD0iMTAwIiB5PSIxMDAiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNiIgZmlsbD0iI2ZmZiIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSI+Tm8gY292ZXI8L3RleHQ+PC9zdmc+';
            };
            
            loadingCover.src = data.cover_url + `&t=${Date.now()}`;
        }

        player.style.opacity = 1;
        setStatus("");


        if (currentConfig.wave_enabled !== false) {
            animateVisualizer();
        }
    }


    function goToIndex() {
        const player = document.getElementById('player');
        player.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        player.style.opacity = '0';
        player.style.transform = 'scale(0.95)';

        setTimeout(() => {
            window.location.href = '/index.html';
        }, 300);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const player = document.getElementById('player');
        player.style.opacity = '0';
        player.style.transform = 'scale(1.05)';

        setTimeout(() => {
            player.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            player.style.opacity = '1';
            player.style.transform = 'scale(1)';
        }, 50);
    });

    function connect() {
        setStatus("Подключение...");

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            setStatus("");
        };

        ws.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);

                if (data.type === 'init' || data.type === 'update') {
                    updatePlayer(data.data);
                    if (data.data.config) {
                        applyConfig(data.data.config);
                    }
                } else if (data.type === 'config_update') {
                    applyConfig(data.config);
                }
            } catch (err) {
                console.error("Ошибка обработки сообщения:", err);
            }
        };

        ws.onclose = () => {
            setStatus("Соединение потеряно");
            stopVisualizer();
            stopProgressUpdate();
            reconnect();
        };

        ws.onerror = (err) => {
            console.error("WebSocket error:", err);
            stopVisualizer();
            stopProgressUpdate();
            reconnect();
        };
    }

    function reconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);      
    }

    document.addEventListener('DOMContentLoaded', () => {
        createVisualizer();
        connect();


        progressBar.addEventListener('click', (e) => {
            if (totalDuration > 0) {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                currentPosition = percent * totalDuration;
                updateProgress();

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: "seek",
                        position: currentPosition
                    }));
                }
            }
        });
    });

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            stopVisualizer();
            stopProgressUpdate();
        } else {
            if (ws && ws.readyState === WebSocket.OPEN && currentConfig.wave_enabled !== false) {
                animateVisualizer();
            }
            if (isPlaying) {
                startProgressUpdate();
            }
        }
    });
    </script>
</body>
