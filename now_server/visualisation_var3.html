<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing v3</title>
    <!-- Google Fonts: Montserrat - стильный популярный шрифт с поддержкой кириллицы -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: rgba(30, 30, 30, 0.95);
            --text-color: #ffffff;
            --accent-color: #1db954;
            --secondary-color: #b3b3b3;
            --progress-color1: #1db954;
            --progress-color2: #1ed760;
            --progress-bg: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent !important; /* ДЛЯ OBS - ПОЛНАЯ ПРОЗРАЧНОСТЬ */
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: var(--justify-content);
            align-items: var(--align-items);
            padding: 20px;
        }

        /* ТЕМНЫЙ ФОН ТОЛЬКО ДЛЯ ПРЕДПРОСМОТРА В БРАУЗЕРЕ */
        @media screen and (min-width: 1024px) {
            body {
                background: rgba(10, 10, 10, 0.9) !important;
            }
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 5px; /* Расстояние между подложками */
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        .player-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* ПОДЛОЖКА 1 - COVER */
        .cover-section {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    z-index: 2;
    width: 100%;
    aspect-ratio: 1;
}

.album-cover {
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    border-radius: inherit;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    box-shadow: 0 0 25px rgba(29, 185, 84, 0.8),
                0 0 45px rgba(29, 185, 84, 0.6),
                0 0 65px rgba(29, 185, 84, 0.4);
    transition: box-shadow 0.8s ease, opacity 0.6s ease-in-out;
}

.album-cover.active {
    opacity: 1;
    z-index: 3;
    pointer-events: auto;
}

.album-cover.inactive {
    opacity: 0;
    z-index: 2;
    pointer-events: none;
}

.ambient-light {
    position: absolute;
    top: -15px;
    left: -15px;
    right: -15px;
    bottom: -15px;
    border-radius: 12px;
    z-index: 0;
    opacity: 1;
    pointer-events: none;
    filter: blur(12px);
    background: radial-gradient(circle at 50% 20%, 
        var(--ambient-color, rgba(29, 185, 84, 0.85)) 0%,
        transparent 65%);
    animation: ambientPulse 3s ease-in-out infinite;
    transition: background 0.5s ease;
}

@keyframes ambientPulse {
    0%, 100% {
        opacity: 0.9;
        transform: scale(1);
    }
    50% {
        opacity: 1;
        transform: scale(1.05);
    }
}

.edge-glow {
    position: absolute;
    top: -15px;
    left: -15px;
    right: -15px;
    bottom: -15px;
    border-radius: 16px;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    filter: blur(20px);
}

.edge-glow.visible {
    opacity: 0.7;
}




        /* ПОДЛОЖКА 2 - ТРЕК + ВИЗУАЛИЗАЦИЯ */
        .track-section {
            position: relative;
            background: var(--bg-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 2;
        }

        .track-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-color);
            line-height: 1.3;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            word-wrap: break-word;
            max-height: none;
            display: -webkit-box;
            -webkit-line-clamp: unset;
            -webkit-box-orient: vertical;
        }

        .artist-name {
            font-size: 32px;
            color: var(--text-color);
            font-weight: 500;
            line-height: 1.1;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            word-wrap: break-word;
            max-height: none;
            display: -webkit-box;
            -webkit-line-clamp: unset;
            -webkit-box-orient: vertical;
        }

        .track-info {
            text-align: center;
            margin-bottom: 15px;
            min-height: auto; /* Убираем фиксированную высоту */
        }

        .visualizer-section {
            width: 100%;
        }

        .visualizer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 30px;
            gap: 2px;
        }

        .visualizer-bar {
            background: linear-gradient(to top, var(--accent-color), var(--wave-color));
            width: 4px;
            border-radius: 2px 2px 0 0;
            transition: all 0.15s ease-out;
            flex: 1;
        }

        /* ПОДЛОЖКА 3 - ПРОГРЕСС БАР */
        .progress-section {
            position: relative;
            background: var(--bg-color);
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: var(--progress-color1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--progress-color2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s ease;
            position: relative;
        }

        .progress::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: var(--text-color);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .progress-bar:hover .progress::after {
            opacity: 1;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            color: var(--secondary-color);
            font-weight: 500;
        }

        .status-section {
            text-align: center;
            height: 18px;
            display: none;
        }

        .status {
            font-size: 10px;
            color: var(--secondary-color);
            opacity: 0.7;
            font-weight: 500;
        }

        /* Анимации */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .player-container {
                max-width: 300px;
            }

            .track-section, .progress-section {
                padding: 15px;
            }

            .track-title {
                font-size: 18px;
            }

            .artist-name {
                font-size: 13px;
            }
        }

        /* Состояние паузы */
        .paused .visualizer-bar {
            opacity: 0.3;
        }

        .paused .album-cover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="player-container" id="player">
        <div class="ambient-light" id="ambientLight"></div>
        
        <!-- ПОДЛОЖКА 1 - COVER -->
        <div class="cover-section">
            <img class="album-cover cover-1 active" id="cover1" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
            <img class="album-cover cover-2 inactive" id="cover2" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
        </div>

        <!-- ПОДЛОЖКА 2 - ТРЕК + ВИЗУАЛИЗАЦИЯ -->
        <div class="track-section">
            <div class="track-info">
                <div class="track-title" id="title">Не воспроизводится</div>
                <div class="artist-name" id="artist">Запустите медиа-плеер</div>
            </div>

            <div class="visualizer-section">
                <div class="visualizer" id="visualizer"></div>
            </div>
        </div>

        <!-- ПОДЛОЖКА 3 - ПРОГРЕСС БАР -->
        <div class="progress-section">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <!-- СТАТУС (скрыт по умолчанию) -->
        <div class="status-section" id="statusSection">
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
    // Элементы DOM
    const player = document.getElementById('player');
    const cover1 = document.getElementById('cover1');
    const cover2 = document.getElementById('cover2');
    let currentCover = cover1; // Текущее активное изображение
    let nextCover = cover2; // Следующее изображение для перехода
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const visualizer = document.getElementById('visualizer');
    const statusText = document.getElementById('status');
    const statusSection = document.getElementById('statusSection');
    const ambientLight = document.getElementById('ambientLight');

    // Переменные состояния
    let ws;
    let reconnectTimer;
    const RECONNECT_DELAY = 3000;
    let animationFrame;
    let currentConfig = {};
    let currentPosition = 0;
    let totalDuration = 0;
    let isPlaying = false;
    let progressInterval;
    let currentAmbientColor = null; // Сохраняем текущий цвет свечения (только из изображения обложки)
    let previousAmbientColor = null; // Предыдущий цвет для плавного перехода
    let colorTransitionAnimation = null; // Анимация перехода цветов

    // Создание визуализатора
    function createVisualizer() {
        visualizer.innerHTML = '';
        for (let i = 0; i < 14; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar';
            bar.style.height = '3px';
            visualizer.appendChild(bar);
        }
    }

    // Форматирование времени
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Обновление прогресса
    function updateProgress() {
        if (totalDuration > 0) {
            const progressPercent = (currentPosition / totalDuration) * 100;
            progress.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentPosition);
            durationEl.textContent = formatTime(totalDuration);
        } else {
            progress.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';
        }
    }

    // Обновление прогресса в реальном времени
    function startProgressUpdate() {
        if (progressInterval) clearInterval(progressInterval);

        progressInterval = setInterval(() => {
            if (isPlaying && currentPosition < totalDuration) {
                currentPosition += 1;
                updateProgress();
            }
        }, 1000);
    }

    function stopProgressUpdate() {
        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }
    }

    function createVisualizer() {
        visualizer.innerHTML = '';
        for (let i = 0; i < 14; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar';
            bar.dataset.phase = (Math.random() * Math.PI * 2).toFixed(2); // уникальная фаза
            bar.style.height = '3px';
            visualizer.appendChild(bar);
        }
    }

    // Анимация визуализатора
    function animateVisualizer() {
        if (!currentConfig.wave_enabled) {
            stopVisualizer();
            return;
        }

        const bars = document.querySelectorAll('.visualizer-bar');
        const time = performance.now() * 0.005; // медленнее и стабильнее, чем Date.now()

        bars.forEach((bar, index) => {
            const offset = index * 0.3;
            const baseHeight = 3;
            const maxHeight = 45;

            // Медленнее и мягче "дышит" — с фазовым смещением
            const phase = parseFloat(bar.dataset.phase);
            const wave = Math.sin(time + offset + phase) * Math.cos(time * 0.7 + phase);
            const targetHeight = baseHeight + Math.abs(wave) * (maxHeight - baseHeight);

            // Интерполяция с плавным откликом (в духе inertia)
            const currentHeight = parseFloat(bar.style.height) || baseHeight;
            const newHeight = currentHeight + (targetHeight - currentHeight) * 0.06; // меньше шаг = мягче

            // Применяем сглаживание по прозрачности
            const opacity = 0.25 + (newHeight / maxHeight) * 0.75;

            bar.style.height = `${newHeight.toFixed(1)}px`;
            bar.style.opacity = opacity.toFixed(2);
        });

        animationFrame = requestAnimationFrame(animateVisualizer);
    }


    function stopVisualizer() {
        cancelAnimationFrame(animationFrame);
        const bars = document.querySelectorAll('.visualizer-bar');
        bars.forEach(bar => {
            bar.style.height = '3px';
            bar.style.opacity = '0.3';
        });
    }

    // Обновление статуса подключения
    function setStatus(text) {
        if (text && text !== "" && text !== "Воспроизведение" && text !== "Подключено") {
            statusSection.style.display = 'block';
            statusText.textContent = text;
        } else {
            statusSection.style.display = 'none';
            statusText.textContent = "";
        }
    }

    // Получение двух доминирующих цветов из изображения
    function getDominantColors(image) {
        return new Promise((resolve, reject) => {
            try {
                if (!image || !image.complete || image.naturalWidth === 0) {
                    reject(new Error('Изображение не загружено'));
                    return;
                }

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = Math.min(200, Math.max(image.naturalWidth, image.naturalHeight));
                canvas.width = size;
                canvas.height = size;
                
                ctx.drawImage(image, 0, 0, size, size);
                const imageData = ctx.getImageData(0, 0, size, size);
                const data = imageData.data;
                
                // Группируем похожие цвета для определения доминирующих
                const colorMap = new Map();
                
                // Берем каждый 8-й пиксель для оптимизации
                for (let i = 0; i < data.length; i += 32) {
                    const alpha = data[i + 3];
                    if (alpha > 10) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        // Округляем цвета для группировки похожих оттенков
                        const roundedR = Math.round(r / 16) * 16;
                        const roundedG = Math.round(g / 16) * 16;
                        const roundedB = Math.round(b / 16) * 16;
                        const key = `${roundedR},${roundedG},${roundedB}`;
                        
                        if (!colorMap.has(key)) {
                            colorMap.set(key, { r: 0, g: 0, b: 0, count: 0 });
                        }
                        const color = colorMap.get(key);
                        color.r += r;
                        color.g += g;
                        color.b += b;
                        color.count++;
                    }
                }
                
                if (colorMap.size === 0) {
                    reject(new Error('Не удалось извлечь данные (нет видимых пикселей)'));
                    return;
                }
                
                // Преобразуем карту в массив, вычисляем яркость, оттенок и фильтруем темные и серые цвета
                const colors = Array.from(colorMap.entries()).map(([key, value]) => {
                    const r = Math.round(value.r / value.count);
                    const g = Math.round(value.g / value.count);
                    const b = Math.round(value.b / value.count);
                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                    const hue = getHue(r, g, b);
                    return {
                        r, g, b,
                        count: value.count,
                        luminance: luminance,
                        hue: hue
                    };
                });
                
                // Фильтруем серые цвета (разница между max и min каналами < 30)
                const nonGrayColors = colors.filter(c => !isColorGray(c.r, c.g, c.b, 30));
                
                // Используем несерые цвета, если их достаточно, иначе все
                const colorsToFilter = nonGrayColors.length >= 2 ? nonGrayColors : colors;
                
                // Фильтруем только светлые цвета (яркость >= 100) для акцентных цветов
                const lightColors = colorsToFilter.filter(c => c.luminance >= 100);
                
                // Если светлых цветов недостаточно, используем цвета с яркостью >= 70 (но не серые)
                let filteredColors = lightColors.length >= 2 ? lightColors : colorsToFilter.filter(c => c.luminance >= 70 && !isColorGray(c.r, c.g, c.b, 30));
                
                // Если все равно недостаточно, используем цвета с яркостью >= 50 (но не серые)
                if (filteredColors.length < 2) {
                    filteredColors = colorsToFilter.filter(c => c.luminance >= 50 && !isColorGray(c.r, c.g, c.b, 30));
                }
                
                // Если и их мало, используем все не черные и не серые
                if (filteredColors.length < 2) {
                    filteredColors = colorsToFilter.filter(c => c.luminance >= 30 && !isColorGray(c.r, c.g, c.b, 30));
                }
                
                // Если совсем нет подходящих, используем несерые цвета
                if (filteredColors.length === 0) {
                    filteredColors = colorsToFilter.length > 0 ? colorsToFilter : colors;
                }
                
                // Сортируем по количеству пикселей (убывание)
                filteredColors.sort((a, b) => b.count - a.count);
                
                // Берем первый доминирующий СВЕТЛЫЙ цвет
                let firstColor = filteredColors[0];
                
                // Предпочитаем светлые цвета (яркость >= 100)
                const veryLightColors = filteredColors.filter(c => c.luminance >= 100);
                if (veryLightColors.length > 0) {
                    firstColor = veryLightColors[0];
                }
                
                // Для второго цвета ищем СВЕТЛЫЙ цвет с ДРУГИМ оттенком
                let secondColor = filteredColors[1] || filteredColors[0];
                
                if (filteredColors.length > 1) {
                    const firstHue = firstColor.hue;
                    const minHueDifference = 30; // Минимальная разница в оттенке (градусы)
                    const minContrast = 120; // Минимальное общее расстояние для хорошего контраста
                    
                    // Если первый цвет красный/розовый, второй должен быть из другой части спектра
                    const isFirstRedPink = isRedOrPink(firstHue);
                    
                    // Ищем светлые цвета с другим оттенком
                    // Если первый цвет красный/розовый, второй НЕ должен быть красным/розовым
                    let lightColorsWithDifferentHue = filteredColors.filter(c => {
                        if (c === firstColor) return false;
                        
                        // СТРОГО запрещаем сочетание красного/розового с красным/розовым
                        if (isFirstRedPink && isRedOrPink(c.hue)) {
                            return false;
                        }
                        
                        // Если первый красный/розовый, второй должен быть из противоположной части спектра
                        if (isFirstRedPink) {
                            // Требуем минимум 90 градусов разницы для второго цвета
                            const hueDiff = Math.abs(c.hue - firstHue);
                            const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                            if (actualHueDiff < 90) {
                                return false; // Слишком близко к красному/розовому
                            }
                        }
                        
                        const hueDiff = Math.abs(c.hue - firstHue);
                        const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                        
                        return c.luminance >= 100 && actualHueDiff >= minHueDifference;
                    });
                    
                    if (lightColorsWithDifferentHue.length > 0) {
                        // Выбираем наиболее контрастный из светлых цветов с другим оттенком
                        lightColorsWithDifferentHue.sort((a, b) => {
                            return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                        });
                        secondColor = lightColorsWithDifferentHue[0];
                        console.log('Найден светлый цвет с другим оттенком:', { hue: secondColor.hue, firstHue: firstHue });
                    } else {
                        // Если не нашли светлых с другим оттенком, ищем любой светлый цвет с хорошим контрастом
                        // СТРОГО запрещаем сочетание красного/розового с красным/розовым
                        const lightContrasting = filteredColors.filter(c => {
                            if (c === firstColor) return false;
                            
                            // СТРОГО запрещаем сочетание красного/розового с красным/розовым
                            if (isFirstRedPink && isRedOrPink(c.hue)) {
                                return false;
                            }
                            
                            // Если первый красный/розовый, второй должен быть из противоположной части спектра
                            if (isFirstRedPink) {
                                const hueDiff = Math.abs(c.hue - firstHue);
                                const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                                if (actualHueDiff < 90) {
                                    return false; // Слишком близко к красному/розовому
                                }
                            }
                            
                            const hueDiff = Math.abs(c.hue - firstHue);
                            const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                            return c.luminance >= 100 && actualHueDiff >= 15 && colorDistance(firstColor, c) >= minContrast;
                        });
                        
                        if (lightContrasting.length > 0) {
                            lightContrasting.sort((a, b) => {
                                return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                            });
                            secondColor = lightContrasting[0];
                            console.log('Найден светлый контрастный цвет');
                        } else {
                            // Ищем наиболее контрастный светлый цвет среди всех
                            // СТРОГО запрещаем сочетание красного/розового с красным/розовым
                            const allLight = filteredColors.filter(c => {
                                if (c.luminance < 100 || c === firstColor) return false;
                                // СТРОГО запрещаем сочетание красного/розового с красным/розовым
                                if (isFirstRedPink && isRedOrPink(c.hue)) {
                                    return false;
                                }
                                // Если первый красный/розовый, второй должен быть из противоположной части спектра
                                if (isFirstRedPink) {
                                    const hueDiff = Math.abs(c.hue - firstHue);
                                    const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                                    if (actualHueDiff < 90) {
                                        return false; // Слишком близко к красному/розовому
                                    }
                                }
                                return true;
                            });
                            if (allLight.length > 0) {
                                allLight.sort((a, b) => {
                                    return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                                });
                                secondColor = allLight[0];
                                console.log('Выбран наиболее контрастный светлый цвет');
                            } else {
                                // В крайнем случае ищем любой цвет с хорошим контрастом (но не красный/розовый если первый красный/розовый)
                                let bestContrast = 0;
                                let bestColor = filteredColors[1] || filteredColors[0];
                                
                                for (let i = 1; i < Math.min(filteredColors.length, 15); i++) {
                                    const candidate = filteredColors[i];
                                    
                                    // СТРОГО запрещаем сочетание красного/розового с красным/розовым
                                    if (isFirstRedPink && isRedOrPink(candidate.hue)) {
                                        continue;
                                    }
                                    
                                    // Если первый красный/розовый, второй должен быть из противоположной части спектра
                                    if (isFirstRedPink) {
                                        const hueDiff = Math.abs(candidate.hue - firstHue);
                                        const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                                        if (actualHueDiff < 90) {
                                            continue; // Слишком близко к красному/розовому
                                        }
                                    }
                                    
                                    const distance = colorDistance(firstColor, candidate);
                                    
                                    if (distance > bestContrast) {
                                        bestContrast = distance;
                                        bestColor = candidate;
                                    }
                                }
                                
                                secondColor = bestColor;
                                console.log('Выбран наиболее контрастный цвет из доступных');
                            }
                        }
                    }
                    
                    // Финальная проверка: убеждаемся, что цвета действительно разные
                    const finalHueDiff = Math.abs(secondColor.hue - firstHue);
                    const actualFinalHueDiff = finalHueDiff > 180 ? 360 - finalHueDiff : finalHueDiff;
                    
                    if (actualFinalHueDiff < 20 && filteredColors.length > 2) {
                        // Если оттенки слишком похожи, ищем цвет в другой части спектра
                        const oppositeHue = (firstHue + 180) % 360;
                        const colorsNearOpposite = filteredColors.filter(c => {
                            if (c === firstColor) return false;
                            
                            // СТРОГО запрещаем сочетание красного/розового с красным/розовым
                            if (isFirstRedPink && isRedOrPink(c.hue)) {
                                return false;
                            }
                            
                            // Если первый красный/розовый, второй должен быть из противоположной части спектра
                            if (isFirstRedPink) {
                                const hueDiff = Math.abs(c.hue - firstHue);
                                const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                                if (actualHueDiff < 90) {
                                    return false; // Слишком близко к красному/розовому
                                }
                            }
                            
                            const hueDiff = Math.abs(c.hue - oppositeHue);
                            const actualDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                            return actualDiff < 60 && c.luminance >= 70;
                        });
                        
                        if (colorsNearOpposite.length > 0) {
                            colorsNearOpposite.sort((a, b) => b.luminance - a.luminance);
                            secondColor = colorsNearOpposite[0];
                            console.log('Выбран цвет с противоположным оттенком для лучшего контраста');
                        }
                    }
                }
                
                // Финальная проверка: запрещаем сочетание красного/розового с красным/розовым
                const isFirstRedPinkFinal = isRedOrPink(firstColor.hue);
                const isSecondRedPinkFinal = isRedOrPink(secondColor.hue);
                
                if (isFirstRedPinkFinal && isSecondRedPinkFinal) {
                    // Если оба цвета красные/розовые, ищем альтернативный второй цвет
                    const alternativeColors = filteredColors.filter(c => {
                        if (c === firstColor) return false;
                        return !isRedOrPink(c.hue);
                    });
                    
                    if (alternativeColors.length > 0) {
                        // Выбираем наиболее контрастный из не красных/розовых
                        alternativeColors.sort((a, b) => {
                            return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                        });
                        secondColor = alternativeColors[0];
                        console.log('Заменен второй цвет - запрещено сочетание красного/розового с красным/розовым');
                    } else {
                        // Если нет альтернатив, выбираем цвет с максимальной разницей в оттенке
                        const nonRedPink = filteredColors.filter(c => {
                            if (c === firstColor) return false;
                            const hueDiff = Math.abs(c.hue - firstColor.hue);
                            const actualHueDiff = hueDiff > 180 ? 360 - hueDiff : hueDiff;
                            return actualHueDiff > 60; // Минимум 60 градусов разницы
                        });
                        
                        if (nonRedPink.length > 0) {
                            nonRedPink.sort((a, b) => {
                                return colorDistance(firstColor, b) - colorDistance(firstColor, a);
                            });
                            secondColor = nonRedPink[0];
                            console.log('Выбран цвет с максимальным отличием от красного/розового');
                        }
                    }
                }
                
                console.log('Извлечены два доминирующих цвета:', {firstColor, secondColor, contrast: colorDistance(firstColor, secondColor)});
                resolve({
                    first: `rgba(${firstColor.r}, ${firstColor.g}, ${firstColor.b}, 0.85)`,
                    second: `rgba(${secondColor.r}, ${secondColor.g}, ${secondColor.b}, 0.85)`
                });
            } catch (error) {
                console.error('Ошибка в getDominantColors:', error);
                reject(error);
            }
        });
    }

    // Получение доминирующего цвета из изображения (для обратной совместимости)
    function getDominantColor(image) {
        return getDominantColors(image).then(colors => colors.first);
    }

    // Осветление цвета (на тон светлее)
    function lightenColor(color, amount = 30) {
        const rgb = parseColor(color);
        const r = Math.min(255, rgb.r + amount);
        const g = Math.min(255, rgb.g + amount);
        const b = Math.min(255, rgb.b + amount);
        return `rgba(${r}, ${g}, ${b}, 0.85)`;
    }

    // Затемнение цвета (на amount тонов темнее)
    function darkenColor(color, amount = 30) {
        const rgb = parseColor(color);
        const r = Math.max(0, rgb.r - amount);
        const g = Math.max(0, rgb.g - amount);
        const b = Math.max(0, rgb.b - amount);
        return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    // Снижение насыщенности цвета (делает цвет мягче, менее пестрым)
    // factor: 0.0 = полностью серый, 1.0 = исходный цвет (0.5 = средняя десатурация)
    function desaturateColor(color, factor = 0.5) {
        const rgb = parseColor(color);
        // Вычисляем яркость для серого компонента
        const luminance = Math.round(0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        // Смешиваем исходный цвет с серым цветом той же яркости
        const r = Math.round(rgb.r * factor + luminance * (1 - factor));
        const g = Math.round(rgb.g * factor + luminance * (1 - factor));
        const b = Math.round(rgb.b * factor + luminance * (1 - factor));
        return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    // Проверка, является ли цвет темным (яркость < порога)
    function isColorDark(color, threshold = 128) {
        const rgb = parseColor(color);
        // Формула относительной яркости (luminance)
        const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        return luminance < threshold;
    }

    // Проверка, является ли цвет серым (все каналы RGB близки друг к другу)
    function isColorGray(r, g, b, threshold = 30) {
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;
        return delta < threshold;
    }

    // Проверка, является ли цвет красным или розовым
    function isRedOrPink(hue) {
        // Красный: 0° - 50° и 320° - 360°
        // Розовый: 280° - 320°
        // Итого: 280° - 50° (включая переход через 360°) - расширенный диапазон
        return (hue >= 280 && hue <= 360) || (hue >= 0 && hue <= 50);
    }

    // Вычисление оттенка (hue) в градусах (0-360)
    function getHue(r, g, b) {
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;
        
        if (delta === 0) return 0; // Серый цвет
        
        let hue = 0;
        if (max === r) {
            hue = ((g - b) / delta) % 6;
        } else if (max === g) {
            hue = (b - r) / delta + 2;
        } else {
            hue = (r - g) / delta + 4;
        }
        
        hue = Math.round(hue * 60);
        if (hue < 0) hue += 360;
        return hue;
    }

    // Вычисление цветового расстояния (Delta E) между двумя цветами
    function colorDistance(color1, color2) {
        const rgb1 = typeof color1 === 'object' ? color1 : parseColor(color1);
        const rgb2 = typeof color2 === 'object' ? color2 : parseColor(color2);
        
        // Используем евклидово расстояние в RGB пространстве
        const dr = rgb1.r - rgb2.r;
        const dg = rgb1.g - rgb2.g;
        const db = rgb1.b - rgb2.b;
        
        // Также учитываем разницу в яркости для лучшего контраста
        const lum1 = 0.299 * rgb1.r + 0.587 * rgb1.g + 0.114 * rgb1.b;
        const lum2 = 0.299 * rgb2.r + 0.587 * rgb2.g + 0.114 * rgb2.b;
        const dlum = Math.abs(lum1 - lum2);
        
        // Вычисляем разницу в оттенке (hue difference)
        const hue1 = getHue(rgb1.r, rgb1.g, rgb1.b);
        const hue2 = getHue(rgb2.r, rgb2.g, rgb2.b);
        let hueDiff = Math.abs(hue1 - hue2);
        if (hueDiff > 180) hueDiff = 360 - hueDiff; // Берем меньшую дугу
        
        // Комбинированное расстояние с большим весом для разницы в оттенке
        return Math.sqrt(dr * dr + dg * dg + db * db) + dlum * 2 + hueDiff * 3;
    }

    // Обеспечивает светлый цвет (если цвет темный, делает его светлым)
    function ensureLightColor(color, minLuminance = 180) {
        const rgb = parseColor(color);
        const currentLuminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        
        if (currentLuminance < minLuminance) {
            // Если цвет темный, осветляем его до минимальной яркости
            const scale = minLuminance / (currentLuminance || 1);
            const r = Math.min(255, Math.round(rgb.r * scale));
            const g = Math.min(255, Math.round(rgb.g * scale));
            const b = Math.min(255, Math.round(rgb.b * scale));
            return `rgba(${r}, ${g}, ${b}, 0.85)`;
        }
        
        return color;
    }

    // Конвертация hex в rgba
    function hexToRgba(hex, alpha = 0.5) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        if (result) {
            const r = parseInt(result[1], 16);
            const g = parseInt(result[2], 16);
            const b = parseInt(result[3], 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        return hex; // Возвращаем исходный цвет, если это не hex
    }

    // Парсинг цвета в RGB
    function parseColor(color) {
        let r, g, b;
        
        if (color.startsWith('rgba(')) {
            const rgb = color.replace('rgba(', '').replace(')', '').split(',');
            r = parseInt(rgb[0].trim());
            g = parseInt(rgb[1].trim());
            b = parseInt(rgb[2].trim());
        } else if (color.startsWith('#')) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(color);
            if (result) {
                r = parseInt(result[1], 16);
                g = parseInt(result[2], 16);
                b = parseInt(result[3], 16);
            } else {
                r = 29; g = 185; b = 84;
            }
        } else {
            r = 29; g = 185; b = 84;
        }
        
        return { r, g, b };
    }

    // Плавный переход между двумя цветами
    function transitionAmbientLight(fromColor, toColor, duration = 800) {
        // Останавливаем предыдущую анимацию, если она есть
        if (colorTransitionAnimation) {
            cancelAnimationFrame(colorTransitionAnimation);
        }
        
        const fromRGB = parseColor(fromColor);
        const toRGB = parseColor(toColor);
        
        const startTime = performance.now();
        const deltaR = toRGB.r - fromRGB.r;
        const deltaG = toRGB.g - fromRGB.g;
        const deltaB = toRGB.b - fromRGB.b;
        
        function animate(currentTime) {
            const elapsed = currentTime - startTime;
            const progress = Math.min(elapsed / duration, 1);
            
            // Easing функция для плавного перехода
            const easeProgress = progress < 0.5 
                ? 2 * progress * progress 
                : 1 - Math.pow(-2 * progress + 2, 2) / 2;
            
            const currentR = Math.round(fromRGB.r + deltaR * easeProgress);
            const currentG = Math.round(fromRGB.g + deltaG * easeProgress);
            const currentB = Math.round(fromRGB.b + deltaB * easeProgress);
            
            const colorString = `rgba(${currentR}, ${currentG}, ${currentB}, 0.85)`;
            
            // Проверяем, включена ли подсветка
            if (currentConfig.ambient_light_enabled === false) {
                return;
            }
            
            // Применяем цвет
            document.documentElement.style.setProperty('--ambient-color', colorString);
            
            // Применяем тень к обоим изображениям
            if (cover1) {
                cover1.style.boxShadow = `
                    0 0 25px rgba(${currentR}, ${currentG}, ${currentB}, 0.8),
                    0 0 45px rgba(${currentR}, ${currentG}, ${currentB}, 0.6),
                    0 0 65px rgba(${currentR}, ${currentG}, ${currentB}, 0.4)
                `;
            }
            if (cover2) {
                cover2.style.boxShadow = `
                    0 0 25px rgba(${currentR}, ${currentG}, ${currentB}, 0.8),
                    0 0 45px rgba(${currentR}, ${currentG}, ${currentB}, 0.6),
                    0 0 65px rgba(${currentR}, ${currentG}, ${currentB}, 0.4)
                `;
            }
            
            if (progress < 1) {
                colorTransitionAnimation = requestAnimationFrame(animate);
            } else {
                colorTransitionAnimation = null;
                // Сохраняем финальный цвет
                currentAmbientColor = colorString;
                previousAmbientColor = colorString;
            }
        }
        
        colorTransitionAnimation = requestAnimationFrame(animate);
    }

    // Обновление ambient light цвета
    function updateAmbientLight(color, useTransition = true) {
        // Проверяем, включена ли подсветка
        if (currentConfig.ambient_light_enabled === false) {
            return; // Не применяем подсветку, если она выключена
        }
        
        const targetRGB = parseColor(color);
        const targetColor = `rgba(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b}, 0.85)`;
        
        // Если нужно использовать переход и есть предыдущий цвет
        if (useTransition && previousAmbientColor && previousAmbientColor !== targetColor) {
            transitionAmbientLight(previousAmbientColor, targetColor);
        } else {
            // Мгновенное применение цвета
            currentAmbientColor = targetColor;
            previousAmbientColor = targetColor;
            document.documentElement.style.setProperty('--ambient-color', targetColor);
            
            // Применяем тень к обоим изображениям
            if (cover1) {
                cover1.style.transition = 'box-shadow 0.8s ease';
                cover1.style.boxShadow = `
                    0 0 25px rgba(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b}, 0.8),
                    0 0 45px rgba(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b}, 0.6),
                    0 0 65px rgba(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b}, 0.4)
                `;
            }
            if (cover2) {
                cover2.style.transition = 'box-shadow 0.8s ease';
                cover2.style.boxShadow = `
                    0 0 25px rgba(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b}, 0.8),
                    0 0 45px rgba(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b}, 0.6),
                    0 0 65px rgba(${targetRGB.r}, ${targetRGB.g}, ${targetRGB.b}, 0.4)
                `;
            }
        }
    }

    // Применение автоматических цветов из изображения
    function applyAutoColors(colors) {
        if (!currentConfig.auto_colors_enabled) {
            return; // Автоматические цвета выключены
        }

        // Первый цвет (осветленный) для обложки
        const coverColor = lightenColor(colors.first);
        updateAmbientLight(coverColor, false);

        // Первый цвет для подложки
        // Проверяем яркость и затемняем, если слишком светлый
        const firstColorRGB = parseColor(colors.first);
        let firstLuminance = (0.299 * firstColorRGB.r + 0.587 * firstColorRGB.g + 0.114 * firstColorRGB.b);
        
        // Если первый цвет слишком темный для подложки, используем второй цвет
        let bgColorToUse = colors.first;
        if (firstLuminance < 50) {
            bgColorToUse = colors.second;
            const secondColorRGB = parseColor(colors.second);
            firstLuminance = (0.299 * secondColorRGB.r + 0.587 * secondColorRGB.g + 0.114 * secondColorRGB.b);
            console.log('Первый цвет слишком темный для подложки, используем второй цвет');
        }
        
        let bgColorRGB = parseColor(bgColorToUse);
        // Если цвет слишком светлый (яркость > 120), затемняем его
        if (firstLuminance > 120) {
            // Чем светлее, тем больше затемняем (до 100 единиц максимум)
            const darkenAmount = Math.min(100, Math.round((firstLuminance - 120) * 0.8));
            bgColorRGB = parseColor(darkenColor(bgColorToUse, darkenAmount));
            console.log(`Цвет подложки слишком светлый (${firstLuminance}), затемняем на ${darkenAmount}`);
        } else if (firstLuminance > 80) {
            // Если яркость 80-120, немного затемняем
            bgColorRGB = parseColor(darkenColor(bgColorToUse, 40));
        }
        // Если яркость <= 80, оставляем как есть или слегка затемняем
        else if (firstLuminance > 50) {
            bgColorRGB = parseColor(darkenColor(bgColorToUse, 20));
        }
        
        // Снижаем насыщенность цвета подложки, чтобы он был мягче (менее пестрым)
        // factor 0.5 делает цвет в два раза менее насыщенным (более мягким)
        const desaturatedBg = desaturateColor(`rgba(${bgColorRGB.r}, ${bgColorRGB.g}, ${bgColorRGB.b}, 1)`, 0.5);
        document.documentElement.style.setProperty('--bg-color', desaturatedBg);

        // Второй цвет (осветленный) для текста, визуализатора и прогресс-бара
        // Убеждаемся, что цвет светлый для хорошей читаемости
        let accentColorLight = lightenColor(colors.second);
        accentColorLight = ensureLightColor(accentColorLight, 180);
        const accentRGB = parseColor(accentColorLight);
        
        // Применяем второй цвет для текста, визуализатора и прогресс-бара
        document.documentElement.style.setProperty('--text-color', `rgba(${accentRGB.r}, ${accentRGB.g}, ${accentRGB.b}, 1)`);
        document.documentElement.style.setProperty('--wave-color', accentColorLight);
        document.documentElement.style.setProperty('--accent-color', accentColorLight);
        document.documentElement.style.setProperty('--progress-color2', accentColorLight);
        
        // Исполнитель использует тот же цвет, что и название трека
        const artistElement = document.getElementById('artist');
        if (artistElement) {
            artistElement.style.color = ''; // Сбрасываем, чтобы использовать CSS переменную --text-color
        }
        
        // Второй цвет затемненный на 2 тона для фона прогресс-бара
        const progressBgColor = darkenColor(colors.second, 60); // 2 тона = 60 единиц
        document.documentElement.style.setProperty('--progress-color1', progressBgColor);
        document.documentElement.style.setProperty('--progress-bg', progressBgColor);
    }

    // Применение конфигурации
    function applyConfig(config) {
        if (config) {
            currentConfig = config;

            // Применяем цвета только если автоматические цвета выключены
            if (!config.auto_colors_enabled) {
                document.documentElement.style.setProperty('--bg-color', config.main_color || config.background_color || 'rgba(30, 30, 30, 0.95)');
                document.documentElement.style.setProperty('--text-color', config.text_color || '#ffffff');
                document.documentElement.style.setProperty('--accent-color', config.accent_color || config.wave_color || '#1db954');
                document.documentElement.style.setProperty('--secondary-color', config.secondary_color || '#b3b3b3');
                document.documentElement.style.setProperty('--progress-color1', config.progress_color1 || config.progress_color || config.accent_color || config.wave_color || '#1db954');
                document.documentElement.style.setProperty('--progress-color2', config.progress_color2 || config.progress_color || '#1ed760');
                document.documentElement.style.setProperty('--progress-bg', config.progress_bg_color || '#404040');
                document.documentElement.style.setProperty('--wave-color', config.wave_color || config.accent_color || '#1db954');
            }
            document.documentElement.style.setProperty('--align-items', config.align_items || 'flex-end');
            document.documentElement.style.setProperty('--justify-content', config.justify_content || 'flex-end');
            
            // Управление подсветкой
            const ambientLightEnabled = config.ambient_light_enabled !== false; // По умолчанию включена
            const ambientLight = document.getElementById('ambientLight');
            if (ambientLight) {
                ambientLight.style.display = ambientLightEnabled ? 'block' : 'none';
            }
            
            // Если подсветка выключена, убираем тени с обложек
            if (!ambientLightEnabled) {
                if (cover1) {
                    cover1.style.boxShadow = 'none';
                }
                if (cover2) {
                    cover2.style.boxShadow = 'none';
                }
            }
            
            // Подсветка применяется только на основе цвета из изображения обложки
            // Акцентный цвет больше не используется для подсветки

            // Исполнитель всегда использует тот же цвет, что и название трека (--text-color)
            const artistElement = document.getElementById('artist');
            if (artistElement) {
                artistElement.style.color = ''; // Сбрасываем, чтобы использовать CSS переменную --text-color
            }

            // Управление визуализатором
            if (config.wave_enabled) {
                animateVisualizer();
            } else {
                stopVisualizer();
            }
        }
    }

    // Обновление данных плеера
    function updatePlayer(data) {
        if (data.status === 'inactive') {
            title.textContent = "Не воспроизводится";
            artist.textContent = "Запустите медиа-плеер";
            const defaultCoverSrc = '/songinfo/NoCover.png';
            if (currentCover) {
                currentCover.src = defaultCoverSrc;
            }
            if (nextCover && nextCover !== currentCover) {
                nextCover.src = defaultCoverSrc;
            }
            stopVisualizer();
            stopProgressUpdate();

            currentPosition = 0;
            totalDuration = 0;
            isPlaying = false;
            updateProgress();

            player.classList.add('paused');
            setStatus("Плеер не обнаружен");
            return;
        }

        // Обновляем данные
        title.textContent = data.title || "Неизвестный трек";
        artist.textContent = data.artist || "Неизвестный исполнитель";

        // Обновляем прогресс
        if (data.position !== undefined) currentPosition = data.position;
        if (data.duration !== undefined) totalDuration = data.duration;
        if (data.is_playing !== undefined) {
            isPlaying = data.is_playing;
            player.classList.toggle('paused', !isPlaying);

            if (isPlaying) {
                startProgressUpdate();
            } else {
                stopProgressUpdate();
            }
        }

        updateProgress();

        // Обновляем обложку
        if (data.cover_url) {
            // Сохраняем текущий цвет как предыдущий перед переключением трека
            // Это нужно для плавного перехода от одного цвета к другому
            if (currentAmbientColor) {
                previousAmbientColor = currentAmbientColor;
            }
            
            // Определяем, какое изображение будет следующим для загрузки
            const loadingCover = nextCover;
            const isFirstLoad = !currentCover.src || currentCover.src.includes('data:image/svg') || currentCover.src === '/no_cover';
            
            // ВАЖНО: Убеждаемся, что loadingCover скрыт перед загрузкой нового изображения
            // Это предотвращает показ "no cover" во время загрузки
            loadingCover.classList.remove('active');
            loadingCover.classList.add('inactive');
            
            // Сбрасываем обработчики для чистого состояния
            loadingCover.onload = null;
            loadingCover.onerror = null;
            
            loadingCover.onload = function() {
                // Проверяем, что изображение действительно загрузилось (не пустое и не no cover)
                if (!loadingCover.src || loadingCover.src.includes('data:image/svg') || loadingCover.src === '/no_cover') {
                    return; // Не переключаемся, если изображение не загружено
                }
                
                // Извлекаем два доминирующих цвета из изображения
                getDominantColors(loadingCover)
                    .then(colors => {
                        console.log('Применяем цвета из изображения:', colors);
                        
                        // Если включены автоматические цвета, применяем их
                        if (currentConfig.auto_colors_enabled) {
                            applyAutoColors(colors);
                        } else {
                            // Используем первый цвет для подсветки обложки с плавным переходом
                            updateAmbientLight(colors.first, !isFirstLoad);
                        }
                    })
                    .catch(error => {
                        console.error('Не удалось извлечь цвета из изображения:', error);
                        // Если не удалось извлечь цвет, используем старую функцию для обратной совместимости
                        getDominantColor(loadingCover)
                            .then(color => {
                                if (!currentConfig.auto_colors_enabled) {
                                    updateAmbientLight(color, !isFirstLoad);
                                }
                            })
                            .catch(() => {
                                // Оставляем предыдущий цвет подсветки
                            });
                    });
                
                // Плавный переход между обложками (crossfade)
                // Если это первая загрузка, просто делаем изображение видимым
                if (isFirstLoad) {
                    loadingCover.classList.remove('inactive');
                    loadingCover.classList.add('active');
                    if (currentCover !== loadingCover) {
                        currentCover.classList.remove('active');
                        currentCover.classList.add('inactive');
                    }
                    currentCover = loadingCover;
                    nextCover = (loadingCover === cover1) ? cover2 : cover1;
                } else {
                    // Переключаем обложки: сначала показываем новую, затем скрываем старую
                    loadingCover.classList.remove('inactive');
                    loadingCover.classList.add('active');
                    
                    // Небольшая задержка для плавного перехода перед скрытием старой
                    setTimeout(() => {
                        if (currentCover !== loadingCover) {
                            currentCover.classList.remove('active');
                            currentCover.classList.add('inactive');
                        }
                    }, 50);
                    
                    // Переключаем указатели для следующего перехода
                    const temp = currentCover;
                    currentCover = nextCover;
                    nextCover = temp;
                }
            };
            
            loadingCover.onerror = () => {
                // При ошибке устанавливаем no cover.png из songinfo
                loadingCover.src = '/no_cover';
                loadingCover.onerror = null; // Сбрасываем обработчик, чтобы избежать бесконечного цикла
                console.error('Ошибка загрузки обложки, используем no_cover.png');
            };
            
            // Устанавливаем новый источник изображения
            const newImageUrl = data.cover_url + `&t=${Date.now()}`;
            loadingCover.src = newImageUrl;
            
            // Если изображение уже загружено (из кеша), onload может не сработать
            // Проверяем это и вызываем обработчик вручную
            if (loadingCover.complete && loadingCover.naturalWidth > 0) {
                // Используем setTimeout, чтобы гарантировать, что onload установлен
                setTimeout(() => {
                    if (loadingCover.onload) {
                        loadingCover.onload();
                    }
                }, 0);
            }
        }

        // Показываем плеер
        player.style.opacity = 1;
        player.classList.add('loaded');
        setStatus("");

        // Запускаем визуализатор если нужно
        if (currentConfig.wave_enabled !== false) {
            animateVisualizer();
        }
    }

    function goToIndex() {
        const player = document.getElementById('player');
        player.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        player.style.opacity = '0';
        player.style.transform = 'scale(0.95)';

        setTimeout(() => {
            window.location.href = '/index.html';
        }, 300);
    }

    // Улучшенная анимация появления
    document.addEventListener('DOMContentLoaded', function() {
        const player = document.getElementById('player');

        // Начальное состояние
        player.style.opacity = '0';
        player.style.transform = 'scale(1.05)';

        // Анимация через небольшой таймаут для плавности
        setTimeout(() => {
            player.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            player.style.opacity = '1';
            player.style.transform = 'scale(1)';
        }, 50);
    });

    // WebSocket подключение
    function connect() {
        setStatus("Подключение...");

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            setStatus("");
        };

        ws.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                console.log('Получены данные:', data);

                if (data.type === 'init' || data.type === 'update') {
                    updatePlayer(data.data);
                    if (data.data.config) {
                        applyConfig(data.data.config);
                    }
                } else if (data.type === 'config_update') {
                    applyConfig(data.config);
                }
            } catch (err) {
                console.error("Ошибка обработки сообщения:", err);
            }
        };

        ws.onclose = () => {
            setStatus("Переподключение...");
            stopVisualizer();
            stopProgressUpdate();
            reconnect();
        };

        ws.onerror = (err) => {
            console.error("WebSocket error:", err);
            stopVisualizer();
            stopProgressUpdate();
        };
    }

    function reconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
    }

    // Обработчик клика на прогресс-бар
    progressBar.addEventListener('click', (e) => {
        if (totalDuration > 0) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            currentPosition = percent * totalDuration;
            updateProgress();

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "seek",
                    position: currentPosition
                }));
            }
        }
    });

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        createVisualizer();
        connect();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopVisualizer();
                stopProgressUpdate();
            } else {
                if (ws && ws.readyState === WebSocket.OPEN && currentConfig.wave_enabled !== false) {
                    animateVisualizer();
                }
                if (isPlaying) {
                    startProgressUpdate();
                }
            }
        });
    });
    </script>
</body>
