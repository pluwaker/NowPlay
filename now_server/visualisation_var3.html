<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing v3</title>
    <!-- Google Fonts: Montserrat - стильный популярный шрифт с поддержкой кириллицы -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: rgba(30, 30, 30, 0.95);
            --text-color: #ffffff;
            --accent-color: #1db954;
            --secondary-color: #b3b3b3;
            --progress-color1: #1db954;
            --progress-color2: #1ed760;
            --progress-bg: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    
        body {
            font-family: 'Montserrat', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent !important; /* ДЛЯ OBS - ПОЛНАЯ ПРОЗРАЧНОСТЬ */
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: var(--justify-content);
            align-items: var(--align-items);
            padding: 20px;
        }

        /* ТЕМНЫЙ ФОН ТОЛЬКО ДЛЯ ПРЕДПРОСМОТРА В БРАУЗЕРЕ */
        @media screen and (min-width: 1024px) {
            body {
                background: rgba(10, 10, 10, 0.9) !important;
            }
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            gap: 5px; /* Расстояние между подложками */
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        .player-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* ПОДЛОЖКА 1 - COVER */
        .cover-section {
    position: relative;
    border-radius: 12px;
    overflow: visible; /* Изменено с hidden на visible для ambient light */
    z-index: 2;
    width: 100%;
    aspect-ratio: 1;
}

.album-cover {
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    border-radius: 12px;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    box-shadow: none; /* Убираем статичную тень, используем только динамическую из JS */
    transition: box-shadow 0.8s ease, opacity 0.6s ease-in-out;
    overflow: hidden;
}

.album-cover.active {
    opacity: 1;
    z-index: 3;
    pointer-events: auto;
}

.album-cover.inactive {
    opacity: 0;
    z-index: 2;
    pointer-events: none;
}

.ambient-light {
    position: absolute;
    top: -10px;
    left: -10px;
    right: -10px;
    bottom: -10px;
    border-radius: 12px;
    z-index: 0;
    opacity: 1;
    pointer-events: none;
    filter: blur(25px);
    background: 
        radial-gradient(circle at 0% 0%, var(--ambient-left-1, transparent) 0%, transparent 40%),
        radial-gradient(circle at 50% 0%, var(--ambient-top-2, transparent) 0%, transparent 40%),
        radial-gradient(circle at 100% 0%, var(--ambient-right-1, transparent) 0%, transparent 40%),
        radial-gradient(circle at 100% 50%, var(--ambient-right-2, transparent) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, var(--ambient-right-3, transparent) 0%, transparent 40%),
        radial-gradient(circle at 50% 100%, var(--ambient-bottom-2, transparent) 0%, transparent 40%),
        radial-gradient(circle at 0% 100%, var(--ambient-left-3, transparent) 0%, transparent 40%),
        radial-gradient(circle at 0% 50%, var(--ambient-left-2, transparent) 0%, transparent 40%);
}

@keyframes ambientPulse {
    0%, 100% {
        opacity: 0.9;
        transform: scale(1);
    }
    50% {
        opacity: 1;
        transform: scale(1.05);
    }
}

.edge-glow {
    position: absolute;
    top: -15px;
    left: -15px;
    right: -15px;
    bottom: -15px;
    border-radius: 16px;
    z-index: 0;
    opacity: 0;
    transition: opacity 0.5s ease;
    pointer-events: none;
    filter: blur(20px);
}

.edge-glow.visible {
    opacity: 0.7;
}




        /* ПОДЛОЖКА 2 - ТРЕК + ВИЗУАЛИЗАЦИЯ */
        .track-section {
            position: relative;
            background: var(--bg-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 2;
            transition: all 0.3s ease;
        }

        /* Эффект стекла для track-section - темное */
        .glass-effect.glass-dark .track-section {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        /* Эффект стекла для track-section - белое */
        .glass-effect.glass-light .track-section {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .track-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-color);
            line-height: 1.3;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            word-wrap: break-word;
            max-height: none;
            display: -webkit-box;
            -webkit-line-clamp: unset;
            line-clamp: unset;
            -webkit-box-orient: vertical;
        }

        .artist-name {
            font-size: 32px;
            color: var(--text-color);
            font-weight: 500;
            line-height: 1.1;
            white-space: normal;
            overflow: visible;
            text-overflow: unset;
            word-wrap: break-word;
            max-height: none;
            display: -webkit-box;
            -webkit-line-clamp: unset;
            line-clamp: unset;
            -webkit-box-orient: vertical;
        }

        .track-info {
            text-align: center;
            margin-bottom: 15px;
            min-height: auto; /* Убираем фиксированную высоту */
        }

        .visualizer-section {
            width: 100%;
        }

        .visualizer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 30px;
            gap: 2px;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease-in, transform 0.3s ease-in;
        }

        .visualizer-bar {
            background: linear-gradient(to top, var(--accent-color), var(--wave-color));
            width: 4px;
            border-radius: 2px 2px 0 0;
            flex: 1;
            transform-origin: bottom;
            height: 50px;
            opacity: 0.3;
            /* CSS анимация вместо JS - легче для CPU */
            animation: wave-animation 1.5s ease-in-out infinite;
            animation-play-state: paused; /* По умолчанию остановлено */
        }

        .visualizer.enabled .visualizer-bar {
            animation-play-state: running;
        }

        /* Плавное исчезновение при выключении */
        .visualizer.fade-out {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
            pointer-events: none;
        }

        .visualizer.fade-out .visualizer-bar {
            animation-play-state: paused;
        }

        /* CSS анимация визуализатора - хаотичное движение */
        @keyframes wave-animation {
            0%, 100% {
                transform: scaleY(0.1);
                opacity: 0.3;
            }
            20% {
                transform: scaleY(var(--bar-max-1, 0.6));
                opacity: var(--bar-opacity-1, 0.8);
            }
            40% {
                transform: scaleY(var(--bar-max-2, 0.3));
                opacity: var(--bar-opacity-2, 0.5);
            }
            60% {
                transform: scaleY(var(--bar-max-3, 0.9));
                opacity: var(--bar-opacity-3, 1.0);
            }
            80% {
                transform: scaleY(var(--bar-max-4, 0.4));
                opacity: var(--bar-opacity-4, 0.6);
            }
        }

        /* Задержки и длительности устанавливаются JavaScript для хаотичности */

        /* ПОДЛОЖКА 3 - ПРОГРЕСС БАР */
        .progress-section {
            position: relative;
            background: var(--bg-color);
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            z-index: 2;
            transition: all 0.3s ease;
        }
        
        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        /* Эффект стекла для progress-section - темное */
        .glass-effect.glass-dark .progress-section {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        /* Эффект стекла для progress-section - белое */
        .glass-effect.glass-light .progress-section {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .progress-bar {
            flex: 1;
            height: 15px;
            background: var(--progress-color1);
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--progress-color2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s ease;
            position: relative;
        }

        .progress::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: var(--text-color);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .progress-bar:hover .progress::after {
            opacity: 1;
        }

        .time-left,
        .time-right {
            font-size: 18px;
            color: var(--text-color);
            font-weight: 500;
            min-width: 45px;
            text-align: center;
        }

        .status-section {
            text-align: center;
            height: 18px;
            display: none;
        }

        .status {
            font-size: 10px;
            color: var(--secondary-color);
            opacity: 0.7;
            font-weight: 500;
        }

        /* Анимации */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .player-container {
                max-width: 300px;
            }

            .track-section, .progress-section {
                padding: 15px;
            }

            .track-title {
                font-size: 18px;
            }

            .artist-name {
                font-size: 13px;
            }
        }

        /* Состояние паузы */
        .paused .visualizer-bar {
            opacity: 0.3;
        }

        .paused .album-cover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="player-container" id="player">
        <!-- ПОДЛОЖКА 1 - COVER -->
        <div class="cover-section">
            <div class="ambient-light" id="ambientLight"></div>
            <img class="album-cover" id="albumCover" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
        </div>

        <!-- ПОДЛОЖКА 2 - ТРЕК + ВИЗУАЛИЗАЦИЯ -->
        <div class="track-section">
            <div class="track-info">
                <div class="track-title" id="title">Не воспроизводится</div>
                <div class="artist-name" id="artist">Запустите медиа-плеер</div>
            </div>

            <div class="visualizer-section">
                <div class="visualizer" id="visualizer"></div>
            </div>
        </div>

        <!-- ПОДЛОЖКА 3 - ПРОГРЕСС БАР -->
        <div class="progress-section">
            <div class="progress-wrapper">
                <span class="time-left" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <span class="time-right" id="duration">0:00</span>
            </div>
        </div>

        <!-- СТАТУС (скрыт по умолчанию) -->
        <div class="status-section" id="statusSection">
            <div class="status" id="status"></div>
        </div>
    </div>

    <script>
    // Элементы DOM
    const player = document.getElementById('player');
    const albumCover = document.getElementById('albumCover');
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const visualizer = document.getElementById('visualizer');
    const statusText = document.getElementById('status');
    const statusSection = document.getElementById('statusSection');
    const ambientLight = document.getElementById('ambientLight');

    // Переменные состояния
    let ws;
    let reconnectTimer;
    const RECONNECT_DELAY = 3000;
    let currentConfig = {};
    let currentPosition = 0;
    let totalDuration = 0;
    let isPlaying = false;
    let progressInterval;
    let currentAmbientColor = null; // Сохраняем текущий цвет свечения (только из изображения обложки)
    let previousAmbientColor = null; // Предыдущий цвет для плавного перехода
    let colorTransitionAnimation = null; // Анимация перехода цветов
    let activeCoverLoadId = null; // ID текущей загрузки обложки для предотвращения race condition
    let lastActiveTimestamp = 0; // Timestamp последнего активного сообщения для защиты от устаревших inactive
    let noCoverTimeout = null; // Таймер для задержки показа NoCover.png
    let colorExtractionTimeout = null; // Таймер для дебаунсинга извлечения цветов
    let pendingCoverUrl = null; // URL обложки, ожидающей обработки

    // Создаём 14 полосок визуализатора с хаотичными параметрами анимации
    function createVisualizer() {
        visualizer.innerHTML = '';
        for (let i = 0; i < 14; i++) {
            const bar = document.createElement('div');
            bar.className = 'visualizer-bar';
            
            // Случайная задержка от 0 до 2 секунд для хаотичности
            const randomDelay = Math.random() * 2;
            // Случайная длительность от 0.8 до 2 секунд для разной скорости
            const randomDuration = 0.8 + Math.random() * 1.2;
            
            // Случайные максимальные высоты для каждой точки анимации (0.3 - 1.0)
            const max1 = 0.3 + Math.random() * 0.7;
            const max2 = 0.3 + Math.random() * 0.7;
            const max3 = 0.3 + Math.random() * 0.7;
            const max4 = 0.3 + Math.random() * 0.7;
            
            // Случайная прозрачность для каждой точки
            const opacity1 = 0.5 + Math.random() * 0.5;
            const opacity2 = 0.4 + Math.random() * 0.4;
            const opacity3 = 0.6 + Math.random() * 0.4;
            const opacity4 = 0.5 + Math.random() * 0.3;
            
            bar.style.animationDelay = `${randomDelay.toFixed(2)}s`;
            bar.style.animationDuration = `${randomDuration.toFixed(2)}s`;
            bar.style.setProperty('--bar-max-1', max1.toFixed(3));
            bar.style.setProperty('--bar-max-2', max2.toFixed(3));
            bar.style.setProperty('--bar-max-3', max3.toFixed(3));
            bar.style.setProperty('--bar-max-4', max4.toFixed(3));
            bar.style.setProperty('--bar-opacity-1', opacity1.toFixed(2));
            bar.style.setProperty('--bar-opacity-2', opacity2.toFixed(2));
            bar.style.setProperty('--bar-opacity-3', opacity3.toFixed(2));
            bar.style.setProperty('--bar-opacity-4', opacity4.toFixed(2));
            
            visualizer.appendChild(bar);
        }
    }

    // Запуск/остановка CSS анимации визуализатора (0% CPU нагрузка!)
    function animateVisualizer() {
        // Проверяем настройки первым делом
        if (currentConfig && currentConfig.wave_enabled === false) {
            stopVisualizer();
            return;
        }
        
        // Убираем класс fade-out
        visualizer.classList.remove('fade-out');
        
        // Показываем визуализатор, если он скрыт
        const wasHidden = visualizer.style.display === 'none';
        if (wasHidden) {
            visualizer.style.display = '';
            // Используем requestAnimationFrame для гарантии применения display
            requestAnimationFrame(() => {
            visualizer.classList.add('enabled');
            });
        } else {
            // Если уже видим, сразу добавляем класс
            visualizer.classList.add('enabled');
        }
    }

    // Остановка анимации с плавным исчезновением
    function stopVisualizer() {
        // Убираем класс enabled, чтобы остановить основную анимацию
        visualizer.classList.remove('enabled');
        
        // Если визуализатор видим, добавляем класс fade-out для плавного исчезновения
        if (visualizer.style.display !== 'none') {
            visualizer.classList.add('fade-out');
            
            // После завершения анимации скрываем визуализатор полностью
            setTimeout(() => {
                visualizer.style.display = 'none';
                visualizer.classList.remove('fade-out');
            }, 400); // Длительность анимации исчезновения
        }
    }

    // Форматирование времени
    function formatTime(seconds) {
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Обновление прогресса
    function updateProgress() {
        if (totalDuration > 0) {
            const progressPercent = (currentPosition / totalDuration) * 100;
            progress.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentPosition);
            durationEl.textContent = formatTime(totalDuration);
        } else {
            progress.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';
        }
    }

    // Обновление прогресса в реальном времени
    function startProgressUpdate() {
        if (progressInterval) clearInterval(progressInterval);

        progressInterval = setInterval(() => {
            if (isPlaying && currentPosition < totalDuration) {
                currentPosition += 1;
                updateProgress();
            }
        }, 1000);
    }

    function stopProgressUpdate() {
        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }
    }

    // Обновление статуса подключения
    function setStatus(text) {
        if (text && text !== "" && text !== "Воспроизведение" && text !== "Подключено") {
            statusSection.style.display = 'block';
            statusText.textContent = text;
        } else {
            statusSection.style.display = 'none';
            statusText.textContent = "";
        }
    }

    // Кеш для результатов извлечения цветов (по URL изображения) - доступен глобально для отладки
    window.colorCache = new Map();
    const colorCache = window.colorCache;
    
    // Статистика производительности (для отладки) - доступна глобально
    window.performanceStats = {
        colorExtractions: 0,
        totalTime: 0,
        maxTime: 0,
        minTime: Infinity,
        cacheHits: 0
    };
    const performanceStats = window.performanceStats;
    
    // Функция для логирования производительности
    function logPerformance(operation, duration) {
        if (window.DEBUG_PERFORMANCE) {
            console.log(`[PERF] ${operation}: ${duration.toFixed(2)}ms`);
        }
    }
    
    // Извлечение цвета из конкретной точки изображения
    function getColorAtPoint(imageData, x, y, width) {
        const index = (y * width + x) * 4;
        return {
            r: imageData.data[index],
            g: imageData.data[index + 1],
            b: imageData.data[index + 2],
            a: imageData.data[index + 3]
        };
    }

    // Извлечение цветов с краев изображения для ambient light градиентов
    function getEdgeColors(image, trackTitle = null, trackArtist = null) {
        return new Promise((resolve, reject) => {
            const startTime = performance.now();
            
            try {
                if (!image || !image.complete || image.naturalWidth === 0) {
                    reject(new Error('Изображение не загружено'));
                    return;
                }

                // Проверяем кеш - используем полный URL с параметрами для уникальности
                const fullUrl = image.src; // Включает параметр v= для версионирования
                const cacheKey = trackTitle && trackArtist 
                    ? `edges_${fullUrl}|${trackTitle}|${trackArtist}` 
                    : `edges_${fullUrl}`;
                
                if (colorCache.has(cacheKey)) {
                    performanceStats.cacheHits++;
                    const cachedResult = colorCache.get(cacheKey);
                    logPerformance('getEdgeColors (CACHED)', performance.now() - startTime);
                    resolve(cachedResult);
                    return;
                }
                
                performanceStats.colorExtractions++;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = 100; // Размер для анализа краев
                canvas.width = size;
                canvas.height = size;
                
                ctx.drawImage(image, 0, 0, size, size);
                const imageData = ctx.getImageData(0, 0, size, size);
                
                // Извлекаем цвета с каждой стороны (2 угла + середина) - непрерывный обход по периметру
                const edges = {
                    left: [
                        getColorAtPoint(imageData, 0, 0, size), // Верхний левый угол
                        getColorAtPoint(imageData, 0, Math.floor(size / 2), size), // Середина левой стороны
                        getColorAtPoint(imageData, 0, size - 1, size) // Нижний левый угол
                    ],
                    bottom: [
                        getColorAtPoint(imageData, 0, size - 1, size), // Левый нижний угол
                        getColorAtPoint(imageData, Math.floor(size / 2), size - 1, size), // Середина нижней стороны
                        getColorAtPoint(imageData, size - 1, size - 1, size) // Правый нижний угол
                    ],
                    right: [
                        getColorAtPoint(imageData, size - 1, size - 1, size), // Правый нижний угол
                        getColorAtPoint(imageData, size - 1, Math.floor(size / 2), size), // Середина правой стороны
                        getColorAtPoint(imageData, size - 1, 0, size) // Правый верхний угол
                    ],
                    top: [
                        getColorAtPoint(imageData, size - 1, 0, size), // Правый верхний угол
                        getColorAtPoint(imageData, Math.floor(size / 2), 0, size), // Середина верхней стороны
                        getColorAtPoint(imageData, 0, 0, size) // Левый верхний угол
                    ]
                };
                
                // Преобразуем в CSS градиенты
                const result = {
                    top: edges.top.map(c => `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`),
                    right: edges.right.map(c => `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`),
                    bottom: edges.bottom.map(c => `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`),
                    left: edges.left.map(c => `rgba(${c.r}, ${c.g}, ${c.b}, 0.85)`)
                };
                
                // Сохраняем в кеш
                if (colorCache.size >= 50) {
                    const firstKey = colorCache.keys().next().value;
                    colorCache.delete(firstKey);
                }
                colorCache.set(cacheKey, result);
                
                const duration = performance.now() - startTime;
                performanceStats.totalTime += duration;
                performanceStats.maxTime = Math.max(performanceStats.maxTime, duration);
                performanceStats.minTime = Math.min(performanceStats.minTime, duration);
                
                logPerformance('getEdgeColors', duration);
                
                resolve(result);
            } catch (error) {
                console.error('Ошибка в getEdgeColors:', error);
                reject(error);
            }
        });
    }

    // Получение доминирующих цветов из изображения (упрощенная версия)
    function getDominantColors(image, trackTitle = null, trackArtist = null) {
        return new Promise((resolve, reject) => {
            const startTime = performance.now();
            
            try {
                if (!image || !image.complete || image.naturalWidth === 0) {
                    reject(new Error('Изображение не загружено'));
                    return;
                }

                // Проверяем кеш - используем полный URL с параметрами для уникальности
                const fullUrl = image.src; // Включает параметр v= для версионирования
                const cacheKey = trackTitle && trackArtist 
                    ? `${fullUrl}|${trackTitle}|${trackArtist}` 
                    : fullUrl;
                
                if (colorCache.has(cacheKey)) {
                    performanceStats.cacheHits++;
                    const cachedResult = colorCache.get(cacheKey);
                    logPerformance('getDominantColors (CACHED)', performance.now() - startTime);
                    resolve(cachedResult);
                    return;
                }
                
                performanceStats.colorExtractions++;

                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const size = 80;
                canvas.width = size;
                canvas.height = size;
                
                ctx.drawImage(image, 0, 0, size, size);
                const imageData = ctx.getImageData(0, 0, size, size);
                const data = imageData.data;
                
                // Группируем похожие цвета
                const colorMap = new Map();
                
                for (let i = 0; i < data.length; i += 128) {
                    const alpha = data[i + 3];
                    if (alpha > 10) {
                        const r = data[i];
                        const g = data[i + 1];
                        const b = data[i + 2];
                        
                        const roundedR = Math.round(r / 16) * 16;
                        const roundedG = Math.round(g / 16) * 16;
                        const roundedB = Math.round(b / 16) * 16;
                        const key = `${roundedR},${roundedG},${roundedB}`;
                        
                        if (!colorMap.has(key)) {
                            colorMap.set(key, { r: 0, g: 0, b: 0, count: 0 });
                        }
                        const color = colorMap.get(key);
                        color.r += r;
                        color.g += g;
                        color.b += b;
                        color.count++;
                    }
                }
                
                if (colorMap.size === 0) {
                    reject(new Error('Не удалось извлечь данные'));
                    return;
                }
                
                // Преобразуем в массив и вычисляем метрики для каждого цвета
                const colors = Array.from(colorMap.entries()).map(([key, value]) => {
                    const r = Math.round(value.r / value.count);
                    const g = Math.round(value.g / value.count);
                    const b = Math.round(value.b / value.count);
                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                    
                    // Вычисляем насыщенность (saturation)
                    const max = Math.max(r, g, b);
                    const min = Math.min(r, g, b);
                    const saturation = max === 0 ? 0 : (max - min) / max;
                    
                    // Проверяем, является ли цвет серым
                    const isGray = (max - min) < 30;
                    
                    // Вычисляем "интересность" цвета:
                    // - Яркие цвета (luminance 80-200) получают бонус
                    // - Насыщенные цвета получают большой бонус
                    // - Серые цвета получают штраф
                    let interestScore = value.count;
                    
                    if (!isGray) {
                        // Бонус за насыщенность (до 5x)
                        interestScore *= (1 + saturation * 4);
                        
                        // Бонус за яркость в диапазоне 80-200 (видимые цвета)
                        if (luminance >= 80 && luminance <= 200) {
                            interestScore *= 2;
                        } else if (luminance >= 50 && luminance < 80) {
                            interestScore *= 1.3;
                        }
                    } else {
                        // Штраф для серых цветов
                        interestScore *= 0.1;
                    }
                    
                    return { r, g, b, count: value.count, luminance, saturation, isGray, interestScore };
                });
                
                // Сортируем по "интересности" вместо популярности
                colors.sort((a, b) => b.interestScore - a.interestScore);
                
                // Берем два самых популярных цвета
                const firstColor = colors[0];
                let secondColor = colors[1] || colors[0];
                
                // Ищем контрастный второй цвет для читаемости текста
                if (colors.length > 1) {
                    let bestContrast = 0;
                    for (let i = 1; i < Math.min(colors.length, 10); i++) {
                        const candidate = colors[i];
                        const contrast = colorDistance(firstColor, candidate);
                        if (contrast > bestContrast) {
                            bestContrast = contrast;
                            secondColor = candidate;
                        }
                    }
                }
                
                const result = {
                    first: `rgba(${firstColor.r}, ${firstColor.g}, ${firstColor.b}, 0.85)`,
                    second: `rgba(${secondColor.r}, ${secondColor.g}, ${secondColor.b}, 0.85)`
                };
                
                // Сохраняем в кеш
                if (colorCache.size >= 50) {
                    const firstKey = colorCache.keys().next().value;
                    colorCache.delete(firstKey);
                }
                colorCache.set(cacheKey, result);
                
                const duration = performance.now() - startTime;
                performanceStats.totalTime += duration;
                performanceStats.maxTime = Math.max(performanceStats.maxTime, duration);
                performanceStats.minTime = Math.min(performanceStats.minTime, duration);
                
                logPerformance('getDominantColors', duration);
                
                if (performanceStats.colorExtractions % 10 === 0) {
                    const avgTime = performanceStats.totalTime / performanceStats.colorExtractions;
                    console.log(`[PERF STATS] Извлечений: ${performanceStats.colorExtractions}, ` +
                              `Кеш попаданий: ${performanceStats.cacheHits}, ` +
                              `Среднее время: ${avgTime.toFixed(2)}ms, ` +
                              `Макс: ${performanceStats.maxTime.toFixed(2)}ms, ` +
                              `Мин: ${performanceStats.minTime.toFixed(2)}ms`);
                }
                
                resolve(result);
            } catch (error) {
                console.error('Ошибка в getDominantColors:', error);
                reject(error);
            }
        });
    }



    // Вычисление расстояния между цветами (для контраста)
    function colorDistance(color1, color2) {
        const dr = color1.r - color2.r;
        const dg = color1.g - color2.g;
        const db = color1.b - color2.b;
        return Math.sqrt(dr * dr + dg * dg + db * db);
    }

    // Затемнение цвета
    function darkenColor(color, amount = 30) {
        const rgb = parseColor(color);
        const r = Math.max(0, rgb.r - amount);
        const g = Math.max(0, rgb.g - amount);
        const b = Math.max(0, rgb.b - amount);
        return `rgba(${r}, ${g}, ${b}, 0.85)`;
    }

    // Осветление цвета (на тон светлее)
    function lightenColor(color, amount = 30) {
        const rgb = parseColor(color);
        const r = Math.min(255, rgb.r + amount);
        const g = Math.min(255, rgb.g + amount);
        const b = Math.min(255, rgb.b + amount);
        return `rgba(${r}, ${g}, ${b}, 0.85)`;
    }

    // Снижение насыщенности цвета
    function desaturateColor(color, factor = 0.5) {
        const rgb = parseColor(color);
        const gray = 0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b;
        const r = Math.round(rgb.r + factor * (gray - rgb.r));
        const g = Math.round(rgb.g + factor * (gray - rgb.g));
        const b = Math.round(rgb.b + factor * (gray - rgb.b));
        return `rgba(${r}, ${g}, ${b}, 0.85)`;
    }

    // Обеспечение светлого цвета (для читаемости текста)
    function ensureLightColor(color, minLuminance = 180) {
        const rgb = parseColor(color);
        const currentLuminance = 0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b;
        
        if (currentLuminance >= minLuminance) {
            return color;
        }
        
        const factor = minLuminance / currentLuminance;
        const r = Math.min(255, Math.round(rgb.r * factor));
        const g = Math.min(255, Math.round(rgb.g * factor));
        const b = Math.min(255, Math.round(rgb.b * factor));
        
        return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    // Затемнение цвета (на amount тонов темнее)
    function darkenColor(color, amount = 30) {
        const rgb = parseColor(color);
        const r = Math.max(0, rgb.r - amount);
        const g = Math.max(0, rgb.g - amount);
        const b = Math.max(0, rgb.b - amount);
        return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    // Снижение насыщенности цвета (делает цвет мягче, менее пестрым)
    // factor: 0.0 = полностью серый, 1.0 = исходный цвет (0.5 = средняя десатурация)
    function desaturateColor(color, factor = 1.0) {
        const rgb = parseColor(color);
        // Вычисляем яркость для серого компонента
        const luminance = Math.round(0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        // Смешиваем исходный цвет с серым цветом той же яркости
        const r = Math.round(rgb.r * factor + luminance * (1 - factor));
        const g = Math.round(rgb.g * factor + luminance * (1 - factor));
        const b = Math.round(rgb.b * factor + luminance * (1 - factor));
        return `rgba(${r}, ${g}, ${b}, 1)`;
    }

    // Проверка, является ли цвет темным (яркость < порога)
    function isColorDark(color, threshold = 128) {
        const rgb = parseColor(color);
        // Формула относительной яркости (luminance)
        const luminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        return luminance < threshold;
    }

    // Проверка, является ли цвет серым (все каналы RGB близки друг к другу)
    function isColorGray(r, g, b, threshold = 30) {
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;
        return delta < threshold;
    }



    // Вычисление оттенка (hue) в градусах (0-360)
    function getHue(r, g, b) {
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const delta = max - min;
        
        if (delta === 0) return 0; // Серый цвет
        
        let hue = 0;
        if (max === r) {
            hue = ((g - b) / delta) % 6;
        } else if (max === g) {
            hue = (b - r) / delta + 2;
        } else {
            hue = (r - g) / delta + 4;
        }
        
        hue = Math.round(hue * 60);
        if (hue < 0) hue += 360;
        return hue;
    }

    // Вычисление цветового расстояния (Delta E) между двумя цветами
    function colorDistance(color1, color2) {
        const rgb1 = typeof color1 === 'object' ? color1 : parseColor(color1);
        const rgb2 = typeof color2 === 'object' ? color2 : parseColor(color2);
        
        // Используем евклидово расстояние в RGB пространстве
        const dr = rgb1.r - rgb2.r;
        const dg = rgb1.g - rgb2.g;
        const db = rgb1.b - rgb2.b;
        
        // Также учитываем разницу в яркости для лучшего контраста
        const lum1 = 0.299 * rgb1.r + 0.587 * rgb1.g + 0.114 * rgb1.b;
        const lum2 = 0.299 * rgb2.r + 0.587 * rgb2.g + 0.114 * rgb2.b;
        const dlum = Math.abs(lum1 - lum2);
        
        // Вычисляем разницу в оттенке (hue difference)
        const hue1 = getHue(rgb1.r, rgb1.g, rgb1.b);
        const hue2 = getHue(rgb2.r, rgb2.g, rgb2.b);
        let hueDiff = Math.abs(hue1 - hue2);
        if (hueDiff > 180) hueDiff = 360 - hueDiff; // Берем меньшую дугу
        
        // Комбинированное расстояние с большим весом для разницы в оттенке
        return Math.sqrt(dr * dr + dg * dg + db * db) + dlum * 2 + hueDiff * 3;
    }

    // Обеспечивает светлый цвет (если цвет темный, делает его светлым)
    function ensureLightColor(color, minLuminance = 180) {
        const rgb = parseColor(color);
        const currentLuminance = (0.299 * rgb.r + 0.587 * rgb.g + 0.114 * rgb.b);
        
        if (currentLuminance < minLuminance) {
            // Если цвет темный, осветляем его до минимальной яркости
            const scale = minLuminance / (currentLuminance || 1);
            const r = Math.min(255, Math.round(rgb.r * scale));
            const g = Math.min(255, Math.round(rgb.g * scale));
            const b = Math.min(255, Math.round(rgb.b * scale));
            return `rgba(${r}, ${g}, ${b}, 0.85)`;
        }
        
        return color;
    }

    // Конвертация hex в rgba
    function hexToRgba(hex, alpha = 0.5) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        if (result) {
            const r = parseInt(result[1], 16);
            const g = parseInt(result[2], 16);
            const b = parseInt(result[3], 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
        return hex; // Возвращаем исходный цвет, если это не hex
    }

    // Парсинг цвета в RGB
    function parseColor(color) {
        let r, g, b;
        
        if (color.startsWith('rgba(')) {
            const rgb = color.replace('rgba(', '').replace(')', '').split(',');
            r = parseInt(rgb[0].trim());
            g = parseInt(rgb[1].trim());
            b = parseInt(rgb[2].trim());
        } else if (color.startsWith('#')) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(color);
            if (result) {
                r = parseInt(result[1], 16);
                g = parseInt(result[2], 16);
                b = parseInt(result[3], 16);
            } else {
                r = 29; g = 185; b = 84;
            }
        } else {
            r = 29; g = 185; b = 84;
        }
        
        return { r, g, b };
    }

    // Проверка контраста между текстом и фоном (WCAG AA стандарт)
    function hasGoodContrast(textColor, bgColor, minRatio = 4.5) {
        const textRGB = parseColor(textColor);
        const bgRGB = parseColor(bgColor);
        
        // Вычисляем относительную яркость
        const getLuminance = (rgb) => {
            const [r, g, b] = [rgb.r, rgb.g, rgb.b].map(val => {
                val = val / 255;
                return val <= 0.03928 ? val / 12.92 : Math.pow((val + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * r + 0.7152 * g + 0.0722 * b;
        };
        
        const lum1 = getLuminance(textRGB);
        const lum2 = getLuminance(bgRGB);
        const ratio = (Math.max(lum1, lum2) + 0.05) / (Math.min(lum1, lum2) + 0.05);
        
        return ratio >= minRatio;
    }

    // Применение автоматических цветов из изображения
    function applyAutoColors(colors, edgeColors) {
        if (!currentConfig.auto_colors_enabled) {
            return;
        }

        // Применяем градиенты для ambient light
        if (edgeColors) {
            updateAmbientLight(edgeColors, false);
        }

        // Используем первый доминантный цвет для подложки
        const firstColorRGB = parseColor(colors.first);
        let firstLuminance = (0.299 * firstColorRGB.r + 0.587 * firstColorRGB.g + 0.114 * firstColorRGB.b);
        
        // Выбираем цвет для подложки
        let bgColorToUse = colors.first;
        if (firstLuminance < 50) {
            bgColorToUse = colors.second;
            const secondColorRGB = parseColor(colors.second);
            firstLuminance = (0.299 * secondColorRGB.r + 0.587 * secondColorRGB.g + 0.114 * secondColorRGB.b);
        }
        
        let bgColorRGB = parseColor(bgColorToUse);
        
        // Корректируем яркость подложки
        if (firstLuminance > 120) {
            const darkenAmount = Math.min(100, Math.round((firstLuminance - 120) * 0.8));
            bgColorRGB = parseColor(darkenColor(bgColorToUse, darkenAmount));
        } else if (firstLuminance > 80) {
            bgColorRGB = parseColor(darkenColor(bgColorToUse, 40));
        } else if (firstLuminance > 50) {
            bgColorRGB = parseColor(darkenColor(bgColorToUse, 20));
        }
        
        // Снижаем насыщенность для мягкости
        const desaturatedBg = desaturateColor(`rgba(${bgColorRGB.r}, ${bgColorRGB.g}, ${bgColorRGB.b}, 1)`, 0.5);
        document.documentElement.style.setProperty('--bg-color', desaturatedBg);

        // Выбираем цвет для текста (второй доминантный)
        let textColor = colors.second;
        let textColorRGB = parseColor(textColor);
        
        // Обеспечиваем хороший контраст для читаемости
        if (!hasGoodContrast(textColor, desaturatedBg)) {
            // Если контраст недостаточный, осветляем текст
            textColor = ensureLightColor(textColor, 200);
            textColorRGB = parseColor(textColor);
            
            // Если все еще недостаточно, используем белый
            if (!hasGoodContrast(textColor, desaturatedBg)) {
                textColor = 'rgba(255, 255, 255, 1)';
                textColorRGB = { r: 255, g: 255, b: 255 };
            }
        }
        
        // Применяем цвет текста
        document.documentElement.style.setProperty('--text-color', `rgba(${textColorRGB.r}, ${textColorRGB.g}, ${textColorRGB.b}, 1)`);
        document.documentElement.style.setProperty('--wave-color', textColor);
        document.documentElement.style.setProperty('--accent-color', textColor);
        document.documentElement.style.setProperty('--progress-color2', textColor);
        
        const artistElement = document.getElementById('artist');
        if (artistElement) {
            artistElement.style.color = '';
        }
        
        // Цвет фона прогресс-бара - проверяем яркость текста
        const textLuminance = (0.299 * textColorRGB.r + 0.587 * textColorRGB.g + 0.114 * textColorRGB.b);
        let progressBgColor;
        
        if (textLuminance > 100) {
            // Если текст светлый, затемняем для фона прогресс-бара
            progressBgColor = darkenColor(textColor, 60);
        } else {
            // Если текст темный, осветляем или используем полупрозрачный вариант
            progressBgColor = `rgba(${textColorRGB.r}, ${textColorRGB.g}, ${textColorRGB.b}, 0.3)`;
        }
        
        document.documentElement.style.setProperty('--progress-color1', progressBgColor);
        document.documentElement.style.setProperty('--progress-bg', progressBgColor);
    }

    // Применение конфигурации
    function applyConfig(config) {
        if (config) {
            const wasAutoColorsEnabled = currentConfig.auto_colors_enabled;
            currentConfig = config;

            // Применяем цвета только если автоматические цвета выключены
            if (!config.auto_colors_enabled) {
            document.documentElement.style.setProperty('--bg-color', config.main_color || config.background_color || 'rgba(30, 30, 30, 0.95)');
            document.documentElement.style.setProperty('--text-color', config.text_color || '#ffffff');
            document.documentElement.style.setProperty('--accent-color', config.accent_color || config.wave_color || '#1db954');
            document.documentElement.style.setProperty('--secondary-color', config.secondary_color || '#b3b3b3');
            document.documentElement.style.setProperty('--progress-color1', config.progress_color1 || config.progress_color || config.accent_color || config.wave_color || '#1db954');
            document.documentElement.style.setProperty('--progress-color2', config.progress_color2 || config.progress_color || '#1ed760');
            document.documentElement.style.setProperty('--progress-bg', config.progress_bg_color || '#404040');
            document.documentElement.style.setProperty('--wave-color', config.wave_color || config.accent_color || '#1db954');
            } else {
                // Если автоматические цвета включены и только что были включены (были выключены)
                // Пересчитываем цвета из текущей обложки
                if (!wasAutoColorsEnabled && config.auto_colors_enabled) {
                    // Проверяем, есть ли загруженная обложка
                    if (albumCover && albumCover.src && albumCover.complete && albumCover.naturalWidth > 0 
                        && !albumCover.src.includes('NoCover') && !albumCover.src.includes('/no_cover')) {
                        console.log('Автоматические цвета включены, пересчитываем цвета из текущей обложки');
                        const currentTitle = title ? title.textContent : null;
                        const currentArtist = artist ? artist.textContent : null;
                        
                        Promise.all([
                            getDominantColors(albumCover, currentTitle, currentArtist),
                            getEdgeColors(albumCover, currentTitle, currentArtist)
                        ])
                            .then(([colors, edgeColors]) => {
                                console.log('Применяем автоматические цвета из текущей обложки:', { colors, edgeColors });
                                applyAutoColors(colors, edgeColors);
                            })
                            .catch(error => {
                                console.error('Не удалось извлечь цвета из обложки:', error);
                            });
                    }
                }
            }
            document.documentElement.style.setProperty('--align-items', config.align_items || 'flex-end');
            document.documentElement.style.setProperty('--justify-content', config.justify_content || 'flex-end');
            
            // Управление подсветкой
            const ambientLightEnabled = config.ambient_light_enabled !== false; // По умолчанию включена
            const ambientLight = document.getElementById('ambientLight');
            if (ambientLight) {
                ambientLight.style.display = ambientLightEnabled ? 'block' : 'none';
            }
            
            // Если подсветка выключена, убираем тень с обложки
            if (!ambientLightEnabled) {
                albumCover.style.boxShadow = 'none';
            }
            
            // Подсветка применяется только на основе цвета из изображения обложки
            // Акцентный цвет больше не используется для подсветки

            // Исполнитель всегда использует тот же цвет, что и название трека (--text-color)
            const artistElement = document.getElementById('artist');
            if (artistElement) {
                artistElement.style.color = ''; // Сбрасываем, чтобы использовать CSS переменную --text-color
            }

            // Управление визуализатором
            if (config.wave_enabled) {
                animateVisualizer();
            } else {
                stopVisualizer();
            }

            // Управление эффектом стекла
            if (config.glass_effect_enabled) {
                player.classList.add('glass-effect');
                // Применяем тип эффекта (темное или белое)
                const glassType = config.glass_effect_type || 'dark';
                player.classList.remove('glass-dark', 'glass-light');
                player.classList.add(`glass-${glassType}`);
            } else {
                player.classList.remove('glass-effect', 'glass-dark', 'glass-light');
            }
        }
    }

    // Обновление данных плеера
    function updatePlayer(data) {
        const messageTimestamp = Date.now();
        
        if (data.status === 'inactive') {
            // Защита от устаревших inactive сообщений после быстрого переключения треков
            // Если недавно было активное сообщение, игнорируем это inactive
            if (lastActiveTimestamp > 0 && (messageTimestamp - lastActiveTimestamp) < 2000) {
                console.log('Игнорируем устаревшее inactive сообщение после активного трека');
                return; // Игнорируем устаревшее сообщение
            }
            
            // Отменяем предыдущий таймер, если он был
            if (noCoverTimeout) {
                clearTimeout(noCoverTimeout);
                noCoverTimeout = null;
            }
            
            // Задержка перед показом NoCover.png (даем время новому треку загрузиться)
            noCoverTimeout = setTimeout(() => {
                // Проверяем еще раз, возможно, за это время пришел новый трек
                if (lastActiveTimestamp > 0 && (Date.now() - lastActiveTimestamp) < 3000) {
                    console.log('Новый трек загрузился, отменяем показ NoCover');
                    return; // Новый трек загрузился, не показываем NoCover
                }
                
                title.textContent = "Не воспроизводится";
                artist.textContent = "Запустите медиа-плеер";
                albumCover.src = '/songinfo/NoCover.png';
                stopVisualizer();
                stopProgressUpdate();

                currentPosition = 0;
                totalDuration = 0;
                isPlaying = false;
                updateProgress();

                player.classList.add('paused');
                setStatus("Плеер не обнаружен");
                lastActiveTimestamp = 0; // Сбрасываем timestamp при реальном inactive
                noCoverTimeout = null;
            }, 1500); // Задержка 1.5 секунды перед показом NoCover
            return;
        }
        
        // Обновляем timestamp при активном сообщении
        lastActiveTimestamp = messageTimestamp;
        
        // Отменяем таймер показа NoCover, если активный трек пришел
        if (noCoverTimeout) {
            clearTimeout(noCoverTimeout);
            noCoverTimeout = null;
        }

        // Обновляем данные только если они присутствуют и не пустые
        // Это предотвращает появление "Неизвестный трек" при быстрых переключениях
        if (data.title !== undefined && data.title !== null && data.title !== '') {
            title.textContent = data.title;
        }
        if (data.artist !== undefined && data.artist !== null && data.artist !== '') {
            artist.textContent = data.artist;
        }

        // Обновляем прогресс синхронно
        if (data.position !== undefined) {
            currentPosition = data.position;
        }
        if (data.duration !== undefined) {
            totalDuration = data.duration;
        }
        
        // Обновляем прогресс сразу, чтобы избежать задержки
        updateProgress();
        
        if (data.is_playing !== undefined) {
            isPlaying = data.is_playing;
            player.classList.toggle('paused', !isPlaying);

            if (isPlaying) {
                startProgressUpdate();
            } else {
                stopProgressUpdate();
            }
        }

        // Обновляем обложку только если есть cover_url
        if (data.cover_url && data.cover_url !== '') {
            // Защита от race condition
            const loadId = Date.now() + Math.random();
            activeCoverLoadId = loadId;
            
            const trackTitle = data.title || title.textContent || null;
            const trackArtist = data.artist || artist.textContent || null;
            
            const isFirstLoad = !albumCover.src || albumCover.src.includes('data:image/svg') || albumCover.src === '/no_cover';
            
            albumCover.onload = function() {
                if (activeCoverLoadId !== loadId) return;
                
                console.log('Обложка загружена:', { src: albumCover.src, width: albumCover.naturalWidth });
                
                if (!albumCover.src || albumCover.naturalWidth === 0) return;
                if (!isFirstLoad && (albumCover.src.includes('/no_cover') || albumCover.src.includes('NoCover'))) return;
                
                // Извлекаем цвета
                if (colorExtractionTimeout) clearTimeout(colorExtractionTimeout);
                
                colorExtractionTimeout = setTimeout(() => {
                    colorExtractionTimeout = null;
                    if (activeCoverLoadId !== loadId) return;
                    
                    const extractColors = () => {
                        Promise.all([
                            getDominantColors(albumCover, trackTitle, trackArtist),
                            getEdgeColors(albumCover, trackTitle, trackArtist)
                        ])
                            .then(([colors, edgeColors]) => {
                                if (activeCoverLoadId !== loadId) return;
                                console.log('Применяем цвета из изображения:', { colors, edgeColors });
                                
                                if (currentConfig.auto_colors_enabled) {
                                    applyAutoColors(colors, edgeColors);
                                } else {
                                    updateAmbientLight(edgeColors, false);
                                }
                            })
                            .catch(error => {
                                console.error('Не удалось извлечь цвета:', error);
                            });
                    };
                    
                    if (window.requestIdleCallback) {
                        requestIdleCallback(extractColors, { timeout: 100 });
                    } else {
                        setTimeout(extractColors, 0);
                    }
                }, 50);
            };
            
            albumCover.onerror = () => {
                if (activeCoverLoadId !== loadId) return;
                albumCover.src = '/no_cover';
                albumCover.onerror = null;
                console.error('Ошибка загрузки обложки');
            };
            
            const newImageUrl = data.cover_url + `&t=${Date.now()}`;
            albumCover.src = newImageUrl;
            
            if (albumCover.complete && albumCover.naturalWidth > 0) {
                setTimeout(() => {
                    if (activeCoverLoadId === loadId && albumCover.onload) {
                        albumCover.onload();
                    }
                }, 0);
            }
        }

        // Показываем плеер
        player.style.opacity = 1;
        player.classList.add('loaded');
        setStatus("");

        // Запускаем визуализатор если нужно
        if (currentConfig.wave_enabled !== false) {
            animateVisualizer();
        }
    }

    function goToIndex() {
        const player = document.getElementById('player');
        player.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        player.style.opacity = '0';
        player.style.transform = 'scale(0.95)';

        setTimeout(() => {
            window.location.href = '/index.html';
        }, 300);
    }

    // Улучшенная анимация появления
    document.addEventListener('DOMContentLoaded', function() {
        const player = document.getElementById('player');

        // Начальное состояние
        player.style.opacity = '0';
        player.style.transform = 'scale(1.05)';

        // Анимация через небольшой таймаут для плавности
        setTimeout(() => {
            player.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            player.style.opacity = '1';
            player.style.transform = 'scale(1)';
        }, 50);
    });

    // WebSocket подключение
    function connect() {
        setStatus("Подключение...");

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            setStatus("");
        };

        ws.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                console.log('Получены данные:', data);

                if (data.type === 'init' || data.type === 'update') {
                    updatePlayer(data.data);
                    if (data.data.config) {
                        applyConfig(data.data.config);
                    }
                } else if (data.type === 'config_update') {
                    applyConfig(data.config);
                }
            } catch (err) {
                console.error("Ошибка обработки сообщения:", err);
            }
        };

        ws.onclose = () => {
            setStatus("Переподключение...");
            stopVisualizer();
            stopProgressUpdate();
            reconnect();
        };

        ws.onerror = (err) => {
            console.error("WebSocket error:", err);
            stopVisualizer();
            stopProgressUpdate();
        };
    }

    function reconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
    }

    // Обработчик клика на прогресс-бар
    progressBar.addEventListener('click', (e) => {
        if (totalDuration > 0) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            currentPosition = percent * totalDuration;
            updateProgress();

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "seek",
                    position: currentPosition
                }));
            }
        }
    });

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        createVisualizer();
        connect();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopVisualizer();
                stopProgressUpdate();
            } else {
                if (ws && ws.readyState === WebSocket.OPEN && currentConfig.wave_enabled !== false) {
                    animateVisualizer();
                }
                if (isPlaying) {
                    startProgressUpdate();
                }
            }
        });
    });
    </script>
</body>
