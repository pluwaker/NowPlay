<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing v2</title>
    <style>
        :root {
            --bg-color: rgba(18, 18, 18, 0.95);
            --text-color: #ffffff;
            --accent-color: #1db954;
            --secondary-color: #b3b3b3;
            --progress-color1: #1db954;
            --progress-color2: #1ed760;
            --progress-bg: #535353;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
           /* background: linear-gradient(135deg, #121212 0%, #2d2d2d 100%); */
            background: transparent !important;
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: var(--justify-content);
            align-items: var(--align-items);
            padding: 20px;
        }
        @media screen and (min-width: 1024px) {
            body {
                background: rgba(10, 10, 10, 0.9) !important;
            }
        }

        .player-container {
            background: var(--bg-color);
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            padding: 30px;
            box-shadow:
                0 20px 40px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5 ease;
            overflow: visible; /* Разрешаем выход подсветки за границы */
        }

        /* Эффект стекла для player-container - темное */
        .player-container.glass-effect.glass-dark {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        /* Эффект стекла для player-container - белое */
        .player-container.glass-effect.glass-light {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .player-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .cover-section {
            position: relative;
            margin-bottom: 25px;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: visible; /* Разрешаем выход подсветки за границы */
        }

        .album-cover {
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            border-radius: 16px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: none;
            transition: box-shadow 0.8s ease, opacity 0.6s ease-in-out;
            overflow: hidden;
        }
        .album-cover.active {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }
        .album-cover.inactive {
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }
        .cover-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            z-index: 4;
            pointer-events: none;
            object-fit: cover;
        }
        .ambient-light {
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 16px;
            z-index: 0;
            opacity: 1;
            pointer-events: none;
            filter: blur(25px);
            background: 
                radial-gradient(circle at 0% 0%, var(--ambient-left-1, transparent) 0%, transparent 40%),
                radial-gradient(circle at 50% 0%, var(--ambient-top-2, transparent) 0%, transparent 40%),
                radial-gradient(circle at 100% 0%, var(--ambient-right-1, transparent) 0%, transparent 40%),
                radial-gradient(circle at 100% 50%, var(--ambient-right-2, transparent) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, var(--ambient-right-3, transparent) 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, var(--ambient-bottom-2, transparent) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, var(--ambient-left-3, transparent) 0%, transparent 40%),
                radial-gradient(circle at 0% 50%, var(--ambient-left-2, transparent) 0%, transparent 40%);
        }
        @keyframes ambientPulse {
            0%, 100% {
                opacity: 0.9;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        .track-info {
            text-align: center;
            margin-bottom: 15px;
        }

        .track-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-color);
            line-height: 1.2;
        }

        .artist-name {
            font-size: 32px;
            color: var(--text-color);
            font-weight: 500;
        }

        .progress-section {
            margin-bottom: 10px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: var(--progress-color1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            margin-bottom: 5px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--progress-color2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s ease;
            position: relative;
        }

        .progress::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--text-color);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .progress-bar:hover .progress::after {
            opacity: 1;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            color: var(--secondary-color);
            font-weight: 500;
        }

        .visualizer-section {
            margin-bottom: 0px;
        }

        .visualizer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 40px;
            gap: 3px;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease-in, transform 0.3s ease-in;
        }

        .visualizer-bar {
            background: linear-gradient(to top, var(--accent-color), var(--wave-color));
            width: 5px;
            border-radius: 3px 3px 0 0;
            flex: 1;
            transform-origin: bottom;
            height: 45px;
            opacity: 0.3;
            /* CSS анимация вместо JS - легче для CPU */
            animation: wave-animation 1.5s ease-in-out infinite;
            animation-play-state: paused; /* По умолчанию остановлено */
        }

        .visualizer.enabled .visualizer-bar {
            animation-play-state: running;
        }

        /* Плавное исчезновение при выключении */
        .visualizer.fade-out {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
            pointer-events: none;
        }

        .visualizer.fade-out .visualizer-bar {
            animation-play-state: paused;
        }

        /* CSS анимация визуализатора - хаотичное движение */
        @keyframes wave-animation {
            0%, 100% {
                transform: scaleY(0.067);
                opacity: 0.3;
            }
            20% {
                transform: scaleY(var(--bar-max-1, 0.6));
                opacity: var(--bar-opacity-1, 0.8);
            }
            40% {
                transform: scaleY(var(--bar-max-2, 0.3));
                opacity: var(--bar-opacity-2, 0.5);
            }
            60% {
                transform: scaleY(var(--bar-max-3, 0.9));
                opacity: var(--bar-opacity-3, 1.0);
            }
            80% {
                transform: scaleY(var(--bar-max-4, 0.4));
                opacity: var(--bar-opacity-4, 0.6);
            }
        }

        /* Задержки и длительности устанавливаются JavaScript для хаотичности */

        .status-section {
            display: none;
            text-align: center;
            height: 10px; /* Фиксированная высота чтобы не прыгало */
        }

        .status {
            font-size: 11px;
            color: var(--secondary-color);
            opacity: 0.7;
            font-weight: 500;
        }

        .connection-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff4444;
            margin-right: 6px;
            transition: background 0.3s ease;
        }

        .connection-dot.connected {
            background: var(--accent-color);
        }

        /* Анимации */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Адаптивность */
        @media (max-width: 480px) {
            .player-container {
                padding: 20px;
                border-radius: 20px;
            }

            .track-title {
                font-size: 20px;
            }

            .artist-name {
                font-size: 14px;
            }
        }

        /* Состояние паузы */
        .paused .visualizer-bar {
            animation-play-state: paused !important;
        }

        .paused .album-cover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="player-container" id="player">
        <div class="cover-section">
            <div class="ambient-light" id="ambientLight"></div>
            <img class="album-cover active" id="cover1" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
            <img class="album-cover inactive" id="cover2" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
            <img class="cover-effect" src="/songinfo/effect.png" alt="Effect" onload="console.log('Effect loaded!')" onerror="console.error('Effect failed to load:', this.src)">
        </div>

        <div class="track-info">
            <div class="track-title" id="title">Не воспроизводится</div>
            <div class="artist-name" id="artist">Запустите медиа-плеер</div>
        </div>

        <div class="progress-section">
            <div class="progress-bar" id="progressBar">
                <div class="progress" id="progress"></div>
            </div>
            <div class="time-display">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>

        <div class="visualizer-section">
            <div class="visualizer" id="visualizer"></div>
        </div>

        <!-- УБИРАЕМ СТАТУС ВОСПРОИЗВЕДЕНИЯ, ОСТАВЛЯЕМ ТОЛЬКО ДЛЯ СООБЩЕНИЙ О ПОДКЛЮЧЕНИИ -->
        <div class="status-section">
            <div class="status" id="status"></div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
    // Элементы DOM
    const player = document.getElementById('player');
    const cover1 = document.getElementById('cover1');
    const cover2 = document.getElementById('cover2');
    let currentCover = cover1; // Текущее активное изображение
    let nextCover = cover2; // Следующее изображение для перехода
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const visualizer = document.getElementById('visualizer');
    const statusText = document.getElementById('status');

    // Переменные состояния
    let ws;
    let reconnectTimer;
    const RECONNECT_DELAY = 3000;
    let currentConfig = {};
    let currentPosition = 0;
    let totalDuration = 0;
    let isPlaying = false;
    let progressInterval;
    
    // Переменные для подсветки
    let currentAmbientColor = null;
    let previousAmbientColor = null;
    let colorTransitionAnimation = null;
    let activeCoverLoadId = null;
    let lastActiveTimestamp = 0;
    let noCoverTimeout = null;
    let colorExtractionTimeout = null;
    let pendingCoverUrl = null;

    // Use colorCache and performanceStats from common.js
    const colorCache = window.colorCache;
    const performanceStats = window.performanceStats;

    // Wrapper functions that use local variables
    function updateProgress() {
        if (totalDuration > 0) {
            const progressPercent = (currentPosition / totalDuration) * 100;
            progress.style.width = `${progressPercent}%`;
            currentTimeEl.textContent = formatTime(currentPosition);
            durationEl.textContent = formatTime(totalDuration);
        } else {
            progress.style.width = '0%';
            currentTimeEl.textContent = '0:00';
            durationEl.textContent = '0:00';
        }
    }

    function startProgressUpdate() {
        if (progressInterval) clearInterval(progressInterval);
        progressInterval = setInterval(() => {
            if (isPlaying && currentPosition < totalDuration) {
                currentPosition += 1;
                updateProgress();
            }
        }, 1000);
    }

    function stopProgressUpdate() {
        if (progressInterval) {
            clearInterval(progressInterval);
            progressInterval = null;
        }
    }

    // Обновление статуса подключения (ТОЛЬКО для сообщений о подключении)
    function setStatus(text, isConnected = false) {
        const statusSection = document.querySelector('.status-section');
        const statusText = document.getElementById('status');

        if (text === "Воспроизведение" || text === "Подключено" || text === "") {
            statusSection.style.display = 'none';
            statusText.textContent = "";
        } else {
            statusSection.style.display = 'block';
            statusText.textContent = text;
        }
    }

    // Применение конфигурации
    function applyConfig(config) {
        if (config) {
            const wasAutoColorsEnabled = currentConfig.auto_colors_enabled;
            currentConfig = config;

            // Применяем цвета только если автоматические цвета выключены
            if (!config.auto_colors_enabled) {
                // Применяем цвета с поддержкой старых и новых названий
                document.documentElement.style.setProperty('--bg-color', config.main_color || config.background_color || 'rgba(18, 18, 18, 0.95)');
                document.documentElement.style.setProperty('--text-color', config.text_color || '#ffffff');
                document.documentElement.style.setProperty('--accent-color', config.accent_color || config.wave_color || '#1db954');
                document.documentElement.style.setProperty('--secondary-color', config.secondary_color || '#b3b3b3');
                document.documentElement.style.setProperty('--progress-color1', config.progress_color1 || config.progress_color || config.accent_color || config.wave_color || '#1db954');
                document.documentElement.style.setProperty('--progress-color2', config.progress_color2 || config.progress_color || '#1ed760');
                document.documentElement.style.setProperty('--progress-bg', config.progress_bg_color || '#535353');
                document.documentElement.style.setProperty('--wave-color', config.wave_color || config.accent_color || '#1db954');
            } else {
                // Если автоматические цвета включены и только что были включены (были выключены)
                // Пересчитываем цвета из текущей обложки
                if (!wasAutoColorsEnabled && config.auto_colors_enabled) {
                    // Проверяем, есть ли загруженная обложка
                    const activeCover = currentCover && currentCover.src && currentCover.complete && currentCover.naturalWidth > 0 ? currentCover : null;
                    if (activeCover && !activeCover.src.includes('NoCover') && !activeCover.src.includes('/no_cover')) {
                        console.log('Автоматические цвета включены, пересчитываем цвета из текущей обложки');
                        const currentTitle = title ? title.textContent : null;
                        const currentArtist = artist ? artist.textContent : null;
                        
                        Promise.all([
                            getDominantColors(activeCover, currentTitle, currentArtist),
                            getEdgeColors(activeCover, currentTitle, currentArtist)
                        ])
                            .then(([colors, edgeColors]) => {
                                console.log('Применяем автоматические цвета из текущей обложки:', { colors, edgeColors });
                                applyAutoColors(colors, edgeColors, config);
                            })
                            .catch(error => {
                                console.error('Не удалось извлечь цвета из обложки:', error);
                            });
                    }
                }
            }
            document.documentElement.style.setProperty('--align-items', config.align_items || 'flex-end');
            document.documentElement.style.setProperty('--justify-content', config.justify_content || 'flex-end');
            
            // Управление подсветкой
            const ambientLightEnabled = config.ambient_light_enabled !== false; // По умолчанию включена
            const ambientLight = document.getElementById('ambientLight');
            if (ambientLight) {
                ambientLight.style.display = ambientLightEnabled ? 'block' : 'none';
            }
            
            // Если подсветка выключена, убираем тени с обложек
            if (!ambientLightEnabled) {
                if (cover1) {
                    cover1.style.boxShadow = 'none';
                }
                if (cover2) {
                    cover2.style.boxShadow = 'none';
                }
            }
            
            // Подсветка применяется только на основе цвета из изображения обложки
            // Акцентный цвет больше не используется для подсветки

            // Исполнитель всегда использует тот же цвет, что и название трека (--text-color)
            const artistElement = document.getElementById('artist');
            if (artistElement) {
                artistElement.style.color = ''; // Сбрасываем, чтобы использовать CSS переменную --text-color
            }

            // Управление визуализатором
            if (config.wave_enabled) {
                animateVisualizer(visualizer, config);
            } else {
                stopVisualizer(visualizer);
            }

            // Управление эффектом стекла
            if (config.glass_effect_enabled) {
                player.classList.add('glass-effect');
                // Применяем тип эффекта (темное или белое)
                const glassType = config.glass_effect_type || 'dark';
                player.classList.remove('glass-dark', 'glass-light');
                player.classList.add(`glass-${glassType}`);
            } else {
                player.classList.remove('glass-effect', 'glass-dark', 'glass-light');
            }
            // Управление эффектом на обложке
            const coverEffectEnabled = config.cover_effect_enabled !== false; // По умолчанию включен
            const coverEffect = document.querySelector('.cover-effect');
            if (coverEffect) {
                coverEffect.style.display = coverEffectEnabled ? 'block' : 'none';
            }
        }
    }

    // Обновление данных плеера
    function updatePlayer(data) {
        const messageTimestamp = Date.now();
        
        if (data.status === 'inactive') {
            // Защита от устаревших inactive сообщений после быстрого переключения треков
            if (lastActiveTimestamp > 0 && (messageTimestamp - lastActiveTimestamp) < 2000) {
                console.log('Игнорируем устаревшее inactive сообщение после активного трека');
                return;
            }
            
            // Отменяем предыдущий таймер, если он был
            if (noCoverTimeout) {
                clearTimeout(noCoverTimeout);
                noCoverTimeout = null;
            }
            
            // Задержка перед показом NoCover.png (даем время новому треку загрузиться)
            noCoverTimeout = setTimeout(() => {
                // Проверяем еще раз, возможно, за это время пришел новый трек
                if (lastActiveTimestamp > 0 && (Date.now() - lastActiveTimestamp) < 3000) {
                    console.log('Новый трек загрузился, отменяем показ NoCover');
                    return;
                }
                
                title.textContent = "Не воспроизводится";
                artist.textContent = "Запустите медиа-плеер";
                const defaultCoverSrc = '/songinfo/NoCover.png';
                if (currentCover) {
                    currentCover.src = defaultCoverSrc;
                }
                if (nextCover && nextCover !== currentCover) {
                    nextCover.src = defaultCoverSrc;
                }
                stopVisualizer(visualizer);
                stopProgressUpdate();

                currentPosition = 0;
                totalDuration = 0;
                isPlaying = false;
                updateProgress();

                player.classList.add('paused');
                // При неактивном плеере показываем статус
                setStatus("Плеер не обнаружен");
                document.querySelector('.status-section').style.display = 'block';
                lastActiveTimestamp = 0;
                noCoverTimeout = null;
            }, 1500); // Задержка 1.5 секунды перед показом NoCover
            return;
        }

        // Обновляем timestamp при активном сообщении
        lastActiveTimestamp = messageTimestamp;
        
        // Отменяем таймер показа NoCover, если активный трек пришел
        if (noCoverTimeout) {
            clearTimeout(noCoverTimeout);
            noCoverTimeout = null;
        }

        document.querySelector('.status-section').style.display = 'none';

        // Обновляем данные
        title.textContent = data.title || "Неизвестный трек";
        artist.textContent = data.artist || "Неизвестный исполнитель";

        // Обновляем прогресс
        if (data.position !== undefined) currentPosition = data.position;
        if (data.duration !== undefined) totalDuration = data.duration;
        if (data.is_playing !== undefined) {
            isPlaying = data.is_playing;
            player.classList.toggle('paused', !isPlaying);

            if (isPlaying) {
                startProgressUpdate();
            } else {
                stopProgressUpdate();
            }
        }

        updateProgress();

        // Обновляем обложку
        if (data.cover_url) {
            // Сохраняем текущий цвет как предыдущий перед переключением трека
            // Это нужно для плавного перехода от одного цвета к другому
            if (currentAmbientColor) {
                previousAmbientColor = currentAmbientColor;
            }
            
            // Защита от race condition: создаем уникальный ID для текущей загрузки
            const loadId = Date.now() + Math.random();
            activeCoverLoadId = loadId;
            
            // Определяем, какое изображение будет следующим для загрузки
            const loadingCover = nextCover;
            const isFirstLoad = !currentCover.src || currentCover.src.includes('data:image/svg') || currentCover.src === '/no_cover';
            
            // Убеждаемся, что loadingCover скрыт перед загрузкой нового изображения
            // Это предотвращает показ "no cover" во время загрузки
            loadingCover.classList.remove('active');
            loadingCover.classList.add('inactive');
            
            // Сбрасываем обработчики для чистого состояния
            loadingCover.onload = null;
            loadingCover.onerror = null;
            
            loadingCover.onload = function() {
                if (colorExtractionTimeout) clearTimeout(colorExtractionTimeout);
                
                colorExtractionTimeout = setTimeout(() => {
                    colorExtractionTimeout = null;
                    if (activeCoverLoadId !== loadId) return;
                    
                    const extractColors = () => {
                        const trackTitle = title ? title.textContent : null;
                        const trackArtist = artist ? artist.textContent : null;
                        
                        Promise.all([
                            getDominantColors(loadingCover, trackTitle, trackArtist),
                            getEdgeColors(loadingCover, trackTitle, trackArtist)
                        ])
                            .then(([colors, edgeColors]) => {
                                if (activeCoverLoadId !== loadId) return;
                                console.log('Применяем цвета из изображения:', { colors, edgeColors });
                                
                                if (currentConfig.auto_colors_enabled) {
                                    applyAutoColors(colors, edgeColors, currentConfig);
                                } else {
                                    updateAmbientLight(edgeColors, document.getElementById('ambientLight'), currentConfig, false);
                                }
                            })
                            .catch(error => {
                                console.error('Не удалось извлечь цвета:', error);
                            });
                    };
                    
                    if (window.requestIdleCallback) {
                        requestIdleCallback(extractColors, { timeout: 100 });
                    } else {
                        setTimeout(extractColors, 0);
                    }
                }, 50);
                
                // Плавный переход между обложками (crossfade)
                // Если это первая загрузка, просто делаем изображение видимым
                if (isFirstLoad) {
                    loadingCover.classList.remove('inactive');
                    loadingCover.classList.add('active');
                    if (currentCover !== loadingCover) {
                        currentCover.classList.remove('active');
                        currentCover.classList.add('inactive');
                    }
                    currentCover = loadingCover;
                    nextCover = (loadingCover === cover1) ? cover2 : cover1;
                } else {
                    loadingCover.classList.remove('inactive');
                    loadingCover.classList.add('active');
                    currentCover.classList.remove('active');
                    currentCover.classList.add('inactive');
                    
                    // Переключаем указатели для следующего перехода
                    const temp = currentCover;
                    currentCover = nextCover;
                    nextCover = temp;
                }
            };
            
            loadingCover.onerror = () => {
                loadingCover.src = '/no_cover';
                // При ошибке загрузки обложки не применяем подсветку
                // Акцентный цвет больше не используется
            };
            
            loadingCover.src = data.cover_url + `&t=${Date.now()}`;
        }

        // Показываем плеер
        player.style.opacity = 1;
        player.classList.add('loaded');

        // СКРЫВАЕМ СТАТУС ПРИ УСПЕШНОМ ВОСПРОИЗВЕДЕНИИ
        setStatus(""); // Пустая строка вместо "Воспроизведение"

        // Запускаем визуализатор если нужно
        if (currentConfig.wave_enabled !== false) {
            animateVisualizer(visualizer, currentConfig);
        }
    }

    function goToIndex() {
        const player = document.getElementById('player');
        player.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        player.style.opacity = '0';
        player.style.transform = 'scale(0.95)';

        setTimeout(() => {
            window.location.href = '/index.html';
        }, 300);
    }

    // Улучшенная анимация появления
    document.addEventListener('DOMContentLoaded', function() {
        const player = document.getElementById('player');

        // Начальное состояние
        player.style.opacity = '0';
        player.style.transform = 'scale(1.05)';

        // Анимация через небольшой таймаут для плавности
        setTimeout(() => {
            player.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            player.style.opacity = '1';
            player.style.transform = 'scale(1)';
        }, 50);
    });



    // WebSocket подключение
    function connect() {
        setStatus("Подключение...");

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            setStatus(""); // Скрываем статус при успешном подключении
        };

        ws.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                console.log('Получены данные:', data);

                if (data.type === 'init' || data.type === 'update') {
                    updatePlayer(data.data);
                    if (data.data.config) {
                        applyConfig(data.data.config);
                    }
                } else if (data.type === 'config_update') {
                    applyConfig(data.config);
                }
            } catch (err) {
                console.error("Ошибка обработки сообщения:", err);
            }
        };

        ws.onclose = () => {
            setStatus("Переподключение...");
            stopVisualizer(visualizer);
            stopProgressUpdate();
            reconnect();
        };

        ws.onerror = (err) => {
            console.error("WebSocket error:", err);
            stopVisualizer(visualizer);
            stopProgressUpdate();
        };
    }

    function reconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
    }

    // Обработчик клика на прогресс-бар
    progressBar.addEventListener('click', (e) => {
        if (totalDuration > 0) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            currentPosition = percent * totalDuration;
            updateProgress();

            // Отправляем команду перемотки на сервер
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "seek",
                    position: currentPosition
                }));
            }
        }
    });

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        // Re-query the visualizer element to ensure it exists
        const visualizerElement = document.getElementById('visualizer');
        console.log('DOMContentLoaded - visualizer element:', visualizerElement);
        if (visualizerElement) {
            createVisualizer(visualizerElement);
        } else {
            console.error('Visualizer element not found! DOM:', document.body.innerHTML.substring(0, 200));
        }
        connect();

        // Останавливаем анимацию при скрытии вкладки
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopVisualizer(visualizer);
                stopProgressUpdate();
            } else {
                if (ws && ws.readyState === WebSocket.OPEN && currentConfig.wave_enabled !== false) {
                    animateVisualizer(visualizer, currentConfig);
                }
                if (isPlaying) {
                    startProgressUpdate();
                }
            }
        });
    });
    </script>
