<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Playing v3 Horizontal</title>
    <!-- Локальныonts: Montserrat - стильный популярный шрифт с поддержкой кириллицы -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: rgba(30, 30, 30, 0.95);
            --text-color: #ffffff;
            --accent-color: #1db954;
            --secondary-color: #b3b3b3;
            --progress-color1: #1db954;
            --progress-color2: #1ed760;
            --progress-bg: #404040;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent !important; /* ДЛЯ OBS - ПОЛНАЯ ПРОЗРАЧНОСТЬ */
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: var(--justify-content);
            align-items: var(--align-items);
            padding: 20px;
            overflow: hidden; /* Убираем прокрутку страницы */
        }

        /* ТЕМНЫЙ ФОН ТОЛЬКО ДЛЯ ПРЕДПРОСМОТРА В БРАУЗЕРЕ */
        @media screen and (min-width: 1024px) {
            body {
                background: rgba(10, 10, 10, 0.9) !important;
            }
        }

        .player-container {
            position: relative;
            width: 100%;
            max-width: 650px; /* Уменьшено с 900px для более узкого виджета */
            display: flex;
            flex-direction: column; /* ВЕРТИКАЛЬНАЯ ОБЕРТКА */
            gap: 5px; /* Расстояние между подложками */
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
        }

        .player-container.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        /* Контейнер для верхней части (обложка + трек) */
        .top-row {
            display: flex;
            flex-direction: row;
            gap: 5px;
        }

        /* ПОДЛОЖКА 1 - COVER */
        .cover-section {
            position: relative;
            border-radius: 12px;
            overflow: visible; /* Позволяем подсветке выходить за границы */
            z-index: 2;
            width: 200px; /* Размер обложки остается прежним */
            min-width: 200px; /* Размер обложки остается прежним */
            aspect-ratio: 1;
            flex-shrink: 0;
        }

        .album-cover {
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            border-radius: 12px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: none;
            transition: box-shadow 0.8s ease, opacity 0.6s ease-in-out;
            overflow: hidden;
        }

        .album-cover.active {
            opacity: 1;
            z-index: 3;
            pointer-events: auto;
        }

        .album-cover.inactive {
            opacity: 0;
            z-index: 2;
            pointer-events: none;
        }

        .cover-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            z-index: 4;
            pointer-events: none;
            object-fit: cover;
        }

        .ambient-light {
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 12px;
            z-index: 0;
            opacity: 1;
            pointer-events: none;
            filter: blur(15px);
            background: 
                radial-gradient(circle at 0% 0%, var(--ambient-left-1, transparent) 0%, transparent 40%),
                radial-gradient(circle at 50% 0%, var(--ambient-top-2, transparent) 0%, transparent 40%),
                radial-gradient(circle at 100% 0%, var(--ambient-right-1, transparent) 0%, transparent 40%),
                radial-gradient(circle at 100% 50%, var(--ambient-right-2, transparent) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, var(--ambient-right-3, transparent) 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, var(--ambient-bottom-2, transparent) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, var(--ambient-left-3, transparent) 0%, transparent 40%),
                radial-gradient(circle at 0% 50%, var(--ambient-left-2, transparent) 0%, transparent 40%);
        }

        @keyframes ambientPulse {
            0%, 100% {
                opacity: 0.9;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
        }

        /* ПОДЛОЖКА 2 - ТРЕК + ВИЗУАЛИЗАЦИЯ */
        .track-section {
            position: relative;
            background: var(--bg-color);
            border-radius: 12px;
            padding: 15px; /* Уменьшено с 20px для более компактного вида */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 12px; /* Уменьшено с 15px */
            z-index: 2;
            flex: 1;
            min-width: 0;
            overflow: hidden; /* Убираем прокрутку текста */
            transition: all 0.3s ease;
        }

        /* Эффект стекла для track-section - темное */
        .glass-effect.glass-dark .track-section {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        /* Эффект стекла для track-section - белое */
        .glass-effect.glass-light .track-section {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .track-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--text-color);
            line-height: 1.3;
            white-space: normal;
            overflow: hidden; /* Убираем прокрутку текста */
            text-overflow: ellipsis; /* Многоточие для длинного текста */
            word-wrap: break-word;
            max-height: none;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Ограничиваем до 2 строк */
            -webkit-box-orient: vertical;
        }

        .artist-name {
            font-size: 24px;
            color: var(--text-color);
            font-weight: 500;
            line-height: 1.1;
            white-space: normal;
            overflow: hidden; /* Убираем прокрутку текста */
            text-overflow: ellipsis; /* Многоточие для длинного текста */
            word-wrap: break-word;
            max-height: none;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* Ограничиваем до 2 строк */
            -webkit-box-orient: vertical;
        }

        .track-info {
            text-align: left;
            margin-bottom: 50px;
            min-height: auto;
            overflow: hidden; /* Убираем прокрутку текста */
            transition: margin-bottom 0.4s ease;
        }

        .visualizer-section {
            width: 100%;
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
        }

        .visualizer-section.fade-out {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
        }

        .visualizer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 30px;
            gap: 2px;
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.3s ease-in, transform 0.3s ease-in;
        }

        .visualizer-bar {
            background: linear-gradient(to top, var(--accent-color), var(--wave-color));
            width: 4px;
            border-radius: 2px 2px 0 0;
            flex: 1;
            transform-origin: bottom;
            height: 55px;
            opacity: 0.3;
            /* CSS анимация вместо JS - легче для CPU */
            animation: wave-animation 1.5s ease-in-out infinite;
            animation-play-state: paused; /* По умолчанию остановлено */
        }

        .visualizer.enabled .visualizer-bar {
            animation-play-state: running;
        }

        /* Плавное исчезновение при выключении */
        .visualizer.fade-out {
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.4s ease-out, transform 0.4s ease-out;
            pointer-events: none;
        }

        .visualizer.fade-out .visualizer-bar {
            animation-play-state: paused;
        }

        /* CSS анимация визуализатора - хаотичное движение */
        @keyframes wave-animation {
            0%, 100% {
                transform: scaleY(0.1);
                opacity: 0.3;
            }
            20% {
                transform: scaleY(var(--bar-max-1, 0.6));
                opacity: var(--bar-opacity-1, 0.8);
            }
            40% {
                transform: scaleY(var(--bar-max-2, 0.3));
                opacity: var(--bar-opacity-2, 0.5);
            }
            60% {
                transform: scaleY(var(--bar-max-3, 0.9));
                opacity: var(--bar-opacity-3, 1.0);
            }
            80% {
                transform: scaleY(var(--bar-max-4, 0.4));
                opacity: var(--bar-opacity-4, 0.6);
            }
        }

        /* ПОДЛОЖКА 3 - ПРОГРЕСС БАР (под двумя верхними подложками) */
        .progress-section {
            position: relative;
            background: var(--bg-color);
            border-radius: 12px;
            padding: 18px 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            z-index: 2;
            width: 100%;
            transition: all 0.4s ease;
        }
        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        
        .progress-wrapper > * {
            align-self: center;
        }

        /* Эффект стекла для progress-section - темное */
        .glass-effect.glass-dark .progress-section {
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
        }

        /* Эффект стекла для progress-section - белое */
        .glass-effect.glass-light .progress-section {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        /* Компактный режим progress-section (внутри track-section) */
        .track-section .progress-section {
            padding: 12px 15px;
            box-shadow: none;
            background: transparent;
            margin-top: 45px;
        }

        .track-section .progress-section .progress-bar {
            height: 12px;
            margin-bottom: 6px;
        }

        .track-section .progress-section .time-display {
            font-size: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 15px;
            background: var(--progress-color1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--progress-color2);
            border-radius: 3px;
            width: 0%;
            transition: width 0.2s ease;
            position: relative;
        }

        .progress::after {
            content: '';
            position: absolute;
            right: -3px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: var(--text-color);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .progress-bar:hover .progress::after {
            opacity: 1;
        }

        .time-left,
        .time-right {
            font-size: 18px;
            color: var(--text-color);
            font-weight: 500;
            min-width: 45px;
            text-align: center;
        }

        .status-section {
            text-align: center;
            height: 18px;
            display: none;
        }

        .status {
            font-size: 10px;
            color: var(--secondary-color);
            opacity: 0.7;
            font-weight: 500;
        }

        /* Анимации */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .player-container {
                max-width: 350px;
            }

            .top-row {
                flex-direction: column;
            }

            .cover-section {
                width: 100%;
            }

            .track-title {
                font-size: 24px;
            }

            .artist-name {
                font-size: 20px;
            }
        }

        /* Состояние паузы */
        .paused .visualizer-bar {
            opacity: 0.3;
        }

        .paused .album-cover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="player-container" id="player">
        <!-- ВЕРХНЯЯ СТРОКА: Обложка + Трек -->
        <div class="top-row">
            <!-- ПОДЛОЖКА 1 - COVER -->
            <div class="cover-section">
                <div class="ambient-light" id="ambientLight"></div>
                <img class="album-cover cover-1 active" id="cover1" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
                <img class="album-cover cover-2 inactive" id="cover2" src="" alt="Album Cover" onclick="goToIndex()" style="cursor: pointer;">
                <img class="cover-effect" src="/songinfo/effect.png" alt="Effect" onload="console.log('Effect loaded!')" onerror="console.error('Effect failed to load:', this.src)">
            </div>

            <!-- ПОДЛОЖКА 2 - ТРЕК + ВИЗУАЛИЗАЦИЯ -->
            <div class="track-section">
                <div class="track-info">
                    <div class="track-title" id="title">Не воспроизводится</div>
                    <div class="artist-name" id="artist">Запустите медиа-плеер</div>
                </div>

                <div class="visualizer-section">
                    <div class="visualizer" id="visualizer"></div>
                </div>
            </div>
        </div>

        <!-- ПОДЛОЖКА 3 - ПРОГРЕСС БАР (под обеими верхними подложками) -->
        <div class="progress-section">
            <div class="progress-wrapper">
                <span class="time-left" id="currentTime">0:00</span>
                <div class="progress-bar" id="progressBar">
                    <div class="progress" id="progress"></div>
                </div>
                <span class="time-right" id="duration">0:00</span>
            </div>
        </div>

        <!-- СТАТУС (скрыт по умолчанию) -->
        <div class="status-section" id="statusSection">
            <div class="status" id="status"></div>
        </div>
    </div>

    <script src="common.js"></script>
    <script>
    // Элементы DOM
    const player = document.getElementById('player');
    const cover1 = document.getElementById('cover1');
    const cover2 = document.getElementById('cover2');
    let currentCover = cover1; // Текущее активное изображение
    let nextCover = cover2; // Следующее изображение для перехода
    const title = document.getElementById('title');
    const artist = document.getElementById('artist');
    const progressBar = document.getElementById('progressBar');
    const progress = document.getElementById('progress');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const visualizer = document.getElementById('visualizer');
    const statusText = document.getElementById('status');
    const statusSection = document.getElementById('statusSection');
    const ambientLight = document.getElementById('ambientLight');
    const progressSection = document.querySelector('.progress-section');
    const trackSection = document.querySelector('.track-section');
    const trackInfo = document.querySelector('.track-info');

    // Переменные состояния
    let ws;
    let reconnectTimer;
    const RECONNECT_DELAY = 3000;
    let currentConfig = {};
    let currentPosition = 0;
    let totalDuration = 0;
    let isPlaying = false;
    let progressInterval;
    let currentAmbientColor = null;
    let previousAmbientColor = null;
    let colorTransitionAnimation = null;
    let activeCoverLoadId = null;
    let lastActiveTimestamp = 0;
    let noCoverTimeout = null;
    let colorExtractionTimeout = null;
    let pendingCoverUrl = null;

    // Кеш для результатов извлечения цветов
    window.colorCache = new Map();
    const colorCache = window.colorCache;
    
    // Статистика производительности
    window.performanceStats = {
        colorExtractions: 0,
        totalTime: 0,
        maxTime: 0,
        minTime: Infinity,
        cacheHits: 0
    };
    const performanceStats = window.performanceStats;
    

    // Запуск/остановка CSS анимации визуализатора (0% CPU нагрузка!)
    function animateVisualizer() {
        // Проверяем настройки первым делом
        if (currentConfig && currentConfig.wave_enabled === false) {
            stopVisualizer();
            return;
        }
        
        // Находим родительский контейнер (visualizer-section)
        const visualizerSection = visualizer.closest('.visualizer-section');
        
        // Убираем класс fade-out
        visualizer.classList.remove('fade-out');
        if (visualizerSection) {
            visualizerSection.classList.remove('fade-out');
        }
        
        // Перемещаем progress-section обратно под top-row (если он был внутри track-section)
        if (progressSection && trackSection && progressSection.parentElement === trackSection) {
            const topRow = trackSection.closest('.top-row');
            if (topRow && topRow.parentElement) {
                topRow.parentElement.insertBefore(progressSection, topRow.nextSibling);
            }
        }
        
        // Восстанавливаем margin-bottom у track-info для визуализатора
        if (trackInfo) {
            trackInfo.style.marginBottom = '50px';
        }
        
        // Показываем визуализатор, если он скрыт
        const wasHidden = visualizer.style.display === 'none' || (visualizerSection && visualizerSection.style.display === 'none');
        if (wasHidden) {
            visualizer.style.display = '';
            if (visualizerSection) {
                visualizerSection.style.display = '';
            }
            // Используем requestAnimationFrame для гарантии применения display
            requestAnimationFrame(() => {
                visualizer.classList.add('enabled');
            });
        } else {
            // Если уже видим, сразу добавляем класс
            visualizer.classList.add('enabled');
        }
    }

    // Остановка анимации с плавным исчезновением
    function stopVisualizer() {
        // Убираем класс enabled, чтобы остановить основную анимацию
        visualizer.classList.remove('enabled');
        
        // Находим родительский контейнер (visualizer-section)
        const visualizerSection = visualizer.closest('.visualizer-section');
        
        // Если визуализатор видим, добавляем класс fade-out для плавного исчезновения
        const isVisible = visualizer.style.display !== 'none' && 
                         (visualizerSection ? visualizerSection.style.display !== 'none' : true) &&
                         window.getComputedStyle(visualizer).display !== 'none';
        
        if (isVisible) {
            visualizer.classList.add('fade-out');
            if (visualizerSection) {
                visualizerSection.classList.add('fade-out');
            }
            
            // После завершения анимации скрываем визуализатор полностью и перемещаем progress-section
            setTimeout(() => {
                visualizer.style.display = 'none';
                visualizer.classList.remove('fade-out');
                if (visualizerSection) {
                    visualizerSection.style.display = 'none';
                    visualizerSection.classList.remove('fade-out');
                }
                
                // Перемещаем progress-section внутрь track-section (компактный режим)
                if (progressSection && trackSection && progressSection.parentElement !== trackSection) {
                    trackSection.appendChild(progressSection);
                }
                
                // Уменьшаем margin-bottom у track-info, так как визуализатор скрыт
                if (trackInfo) {
                    trackInfo.style.marginBottom = '0px';
                }
            }, 400); // Длительность анимации исчезновения
        } else {
            // Если визуализатор уже скрыт, сразу перемещаем progress-section
            if (progressSection && trackSection && progressSection.parentElement !== trackSection) {
                trackSection.appendChild(progressSection);
            }
            
            // Уменьшаем margin-bottom у track-info
            if (trackInfo) {
                trackInfo.style.marginBottom = '0px';
            }
        }
    }

    // Обновление статуса подключения
    function setStatus(text) {
        if (text && text !== "" && text !== "Воспроизведение" && text !== "Подключено") {
            statusSection.style.display = 'block';
            statusText.textContent = text;
        } else {
            statusSection.style.display = 'none';
            statusText.textContent = "";
        }
    }


    // Применение конфигурации
    function applyConfig(config) {
        if (config) {
            const wasAutoColorsEnabled = currentConfig.auto_colors_enabled;
            currentConfig = config;

            // Применяем цвета только если автоматические цвета выключены
            if (!config.auto_colors_enabled) {
            document.documentElement.style.setProperty('--bg-color', config.main_color || config.background_color || 'rgba(30, 30, 30, 0.95)');
            document.documentElement.style.setProperty('--text-color', config.text_color || '#ffffff');
            document.documentElement.style.setProperty('--accent-color', config.accent_color || config.wave_color || '#1db954');
            document.documentElement.style.setProperty('--secondary-color', config.secondary_color || '#b3b3b3');
            document.documentElement.style.setProperty('--progress-color1', config.progress_color1 || config.progress_color || config.accent_color || config.wave_color || '#1db954');
            document.documentElement.style.setProperty('--progress-color2', config.progress_color2 || config.progress_color || '#1ed760');
            document.documentElement.style.setProperty('--progress-bg', config.progress_bg_color || '#404040');
            document.documentElement.style.setProperty('--wave-color', config.wave_color || config.accent_color || '#1db954');
            } else {
                // Если автоматические цвета включены и только что были включены (были выключены)
                // Пересчитываем цвета из текущей обложки
                if (!wasAutoColorsEnabled && config.auto_colors_enabled) {
                    // Проверяем, есть ли загруженная обложка
                    const activeCover = currentCover && currentCover.src && currentCover.complete && currentCover.naturalWidth > 0 ? currentCover : null;
                    if (activeCover && !activeCover.src.includes('NoCover') && !activeCover.src.includes('/no_cover')) {
                        console.log('Автоматические цвета включены, пересчитываем цвета из текущей обложки');
                        const currentTitle = title ? title.textContent : null;
                        const currentArtist = artist ? artist.textContent : null;
                        
                        Promise.all([
                            getDominantColors(activeCover, currentTitle, currentArtist),
                            getEdgeColors(activeCover, currentTitle, currentArtist)
                        ])
                            .then(([colors, edgeColors]) => {
                                console.log('Применяем автоматические цвета из текущей обложки:', { colors, edgeColors });
                                applyAutoColors(colors, edgeColors, config);
                            })
                            .catch(error => {
                                console.error('Не удалось извлечь цвета из обложки:', error);
                            });
                    }
                }
            }
            document.documentElement.style.setProperty('--align-items', config.align_items || 'flex-end');
            document.documentElement.style.setProperty('--justify-content', config.justify_content || 'flex-end');
            
            // Управление подсветкой
            const ambientLightEnabled = config.ambient_light_enabled !== false; // По умолчанию включена
            const ambientLight = document.getElementById('ambientLight');
            if (ambientLight) {
                ambientLight.style.display = ambientLightEnabled ? 'block' : 'none';
            }
            
            // Если подсветка выключена, убираем тени с обложек
            if (!ambientLightEnabled) {
                if (cover1) {
                    cover1.style.boxShadow = 'none';
                }
                if (cover2) {
                    cover2.style.boxShadow = 'none';
                }
            }
            
            // Управление отображением времени и прогресс-бара
            const showTime = config.show_time !== false; // По умолчанию показываем
            const progressSection = document.querySelector('.progress-section');
            if (progressSection) {
                progressSection.style.display = showTime ? 'block' : 'none';
            }
            
            // Подсветка применяется только на основе цвета из изображения обложки
            // Акцентный цвет больше не используется для подсветки

            // Исполнитель всегда использует тот же цвет, что и название трека (--text-color)
            const artistElement = document.getElementById('artist');
            if (artistElement) {
                artistElement.style.color = ''; // Сбрасываем, чтобы использовать CSS переменную --text-color
            }

            // Управление визуализатором
            if (config.wave_enabled) {
                animateVisualizer();
            } else {
                stopVisualizer();
            }

            // Управление эффектом стекла
            if (config.glass_effect_enabled) {
                player.classList.add('glass-effect');
                // Применяем тип эффекта (темное или белое)
                const glassType = config.glass_effect_type || 'dark';
                player.classList.remove('glass-dark', 'glass-light');
                player.classList.add(`glass-${glassType}`);
            } else {
                player.classList.remove('glass-effect', 'glass-dark', 'glass-light');
            }

            // Управление эффектом на обложке
            const coverEffectEnabled = config.cover_effect_enabled !== false; // По умолчанию включен
            const coverEffect = document.querySelector('.cover-effect');
            if (coverEffect) {
                coverEffect.style.display = coverEffectEnabled ? 'block' : 'none';
            }
        }
    }
      

    // Обновление данных плеера
    function updatePlayer(data) {
        const messageTimestamp = Date.now();
        
        if (data.status === 'inactive') {
            // Защита от устаревших inactive сообщений после быстрого переключения треков
            // Если недавно было активное сообщение, игнорируем это inactive
            if (lastActiveTimestamp > 0 && (messageTimestamp - lastActiveTimestamp) < 2000) {
                console.log('Игнорируем устаревшее inactive сообщение после активного трека');
                return; // Игнорируем устаревшее сообщение
            }
            
            // Отменяем предыдущий таймер, если он был
            if (noCoverTimeout) {
                clearTimeout(noCoverTimeout);
                noCoverTimeout = null;
            }
            
            // Задержка перед показом NoCover.png (даем время новому треку загрузиться)
            noCoverTimeout = setTimeout(() => {
                // Проверяем еще раз, возможно, за это время пришел новый трек
                if (lastActiveTimestamp > 0 && (Date.now() - lastActiveTimestamp) < 3000) {
                    console.log('Новый трек загрузился, отменяем показ NoCover');
                    return; // Новый трек загрузился, не показываем NoCover
                }
                
                title.textContent = "Не воспроизводится";
                artist.textContent = "Запустите медиа-плеер";
                const defaultCoverSrc = '/songinfo/NoCover.png';
                if (currentCover) {
                    currentCover.src = defaultCoverSrc;
                }
                if (nextCover && nextCover !== currentCover) {
                    nextCover.src = defaultCoverSrc;
                }
                stopVisualizer();
                stopProgressUpdate(progressInterval);
                progressInterval = null;

                currentPosition = 0;
                totalDuration = 0;
                isPlaying = false;
                updateProgress(currentPosition, totalDuration, progress, currentTimeEl, durationEl);

                player.classList.add('paused');
                setStatus("Плеер не обнаружен");
                lastActiveTimestamp = 0; // Сбрасываем timestamp при реальном inactive
                noCoverTimeout = null;
            }, 1500); // Задержка 1.5 секунды перед показом NoCover
            return;
        }
        
        // Обновляем timestamp при активном сообщении
        lastActiveTimestamp = messageTimestamp;
        
        // Отменяем таймер показа NoCover, если активный трек пришел
        if (noCoverTimeout) {
            clearTimeout(noCoverTimeout);
            noCoverTimeout = null;
        }

        // Обновляем данные только если они присутствуют и не пустые
        // Это предотвращает появление "Неизвестный трек" при быстрых переключениях
        if (data.title !== undefined && data.title !== null && data.title !== '') {
            title.textContent = data.title;
        }
        if (data.artist !== undefined && data.artist !== null && data.artist !== '') {
            artist.textContent = data.artist;
        }

        // Обновляем прогресс синхронно
        if (data.position !== undefined) {
            currentPosition = data.position;
        }
        if (data.duration !== undefined) {
            totalDuration = data.duration;
        }
        
        // Обновляем прогресс сразу, чтобы избежать задержки
        updateProgress(currentPosition, totalDuration, progress, currentTimeEl, durationEl);
        
        if (data.is_playing !== undefined) {
            isPlaying = data.is_playing;
            player.classList.toggle('paused', !isPlaying);

            if (isPlaying) {
                // Останавливаем предыдущий интервал перед созданием нового
                if (progressInterval) {
                    stopProgressUpdate(progressInterval);
                    progressInterval = null;
                }
                const state = { currentPosition, totalDuration, isPlaying };
                progressInterval = startProgressUpdate(state, () => {
                    currentPosition = state.currentPosition;
                    updateProgress(currentPosition, totalDuration, progress, currentTimeEl, durationEl);
                });
            } else {
                stopProgressUpdate(progressInterval);
                progressInterval = null;
            }
        }

        // Обновляем обложку только если есть cover_url
        // Если cover_url отсутствует, сохраняем текущую обложку
        if (data.cover_url && data.cover_url !== '') {
            // Проверяем, изменился ли URL обложки (без timestamp)
            const currentCoverUrl = currentCover.src ? currentCover.src.split('&t=')[0].split('?v=')[1] : null;
            const newCoverVersion = data.cover_url.split('?v=')[1];
            
            // Загружаем обложку только если версия изменилась
            if (currentCoverUrl !== newCoverVersion) {
                // Сохраняем текущий цвет как предыдущий перед переключением трека
                // Это нужно для плавного перехода от одного цвета к другому
                if (currentAmbientColor) {
                    previousAmbientColor = currentAmbientColor;
                }
                
                // Защита от race condition: создаем уникальный ID для текущей загрузки
                const loadId = Date.now() + Math.random();
                activeCoverLoadId = loadId;
            
            // Определяем, какое изображение будет следующим для загрузки
            const loadingCover = nextCover;
            const isFirstLoad = !currentCover.src || currentCover.src.includes('data:image/svg') || currentCover.src === '/no_cover';
            
            // ВАЖНО: Убеждаемся, что loadingCover скрыт перед загрузкой нового изображения
            // Это предотвращает показ "no cover" во время загрузки
            loadingCover.classList.remove('active');
            loadingCover.classList.add('inactive');
            
            // Сбрасываем обработчики для чистого состояния
            loadingCover.onload = null;
            loadingCover.onerror = null;
            
            loadingCover.onload = function() {
                if (activeCoverLoadId !== loadId) {
                    return;
                }
                
                if (!loadingCover.src || loadingCover.naturalWidth === 0) {
                    return;
                }
                
                if (!isFirstLoad && (loadingCover.src.includes('/no_cover') || loadingCover.src.includes('NoCover'))) {
                    return;
                }
                
                if (colorExtractionTimeout) clearTimeout(colorExtractionTimeout);
                
                colorExtractionTimeout = setTimeout(() => {
                    colorExtractionTimeout = null;
                    if (activeCoverLoadId !== loadId) return;
                    
                    const extractColors = () => {
                        const trackTitle = title ? title.textContent : null;
                        const trackArtist = artist ? artist.textContent : null;
                        
                        Promise.all([
                            getDominantColors(loadingCover, trackTitle, trackArtist),
                            getEdgeColors(loadingCover, trackTitle, trackArtist)
                        ])
                            .then(([colors, edgeColors]) => {
                                if (activeCoverLoadId !== loadId) return;
                                console.log('Применяем цвета из изображения:', { colors, edgeColors });
                                
                                if (currentConfig.auto_colors_enabled) {
                                    applyAutoColors(colors, edgeColors, currentConfig);
                                } else {
                                    updateAmbientLight(edgeColors, ambientLight, currentConfig, false);
                                }
                            })
                            .catch(error => {
                                console.error('Не удалось извлечь цвета:', error);
                            });
                    };
                    
                    if (window.requestIdleCallback) {
                        requestIdleCallback(extractColors, { timeout: 100 });
                    } else {
                        setTimeout(extractColors, 0);
                    }
                }, 50);
                
                // Плавный переход между обложками (crossfade)
                // Если это первая загрузка, просто делаем изображение видимым
                if (isFirstLoad) {
                    console.log('Первая загрузка обложки, показываем изображение');
                    loadingCover.classList.remove('inactive');
                    loadingCover.classList.add('active');
                    if (currentCover !== loadingCover) {
                        currentCover.classList.remove('active');
                        currentCover.classList.add('inactive');
                    }
                    currentCover = loadingCover;
                    nextCover = (loadingCover === cover1) ? cover2 : cover1;
                } else {
                    console.log('Переключение обложки, показываем новую');
                    // Переключаем обложки с crossfade эффектом
                    loadingCover.classList.remove('inactive');
                    loadingCover.classList.add('active');
                    currentCover.classList.remove('active');
                    currentCover.classList.add('inactive');
                    
                    // Переключаем указатели для следующего перехода
                    currentCover = loadingCover;
                    nextCover = (loadingCover === cover1) ? cover2 : cover1;
                }
            };
            
            loadingCover.onerror = () => {
                // Защита от race condition: проверяем, что это еще актуальная загрузка
                if (activeCoverLoadId !== loadId) {
                    console.log('Игнорируем устаревшую ошибку загрузки обложки');
                    return; // Эта загрузка уже устарела, игнорируем её
                }
                
                // При ошибке устанавливаем no cover.png из songinfo
                loadingCover.src = '/no_cover';
                loadingCover.onerror = null; // Сбрасываем обработчик, чтобы избежать бесконечного цикла
                console.error('Ошибка загрузки обложки, используем no_cover.png');
                };
                
                // Устанавливаем новый источник изображения
                const newImageUrl = data.cover_url + `&t=${Date.now()}`;
                loadingCover.src = newImageUrl;
                
                // Если изображение уже загружено (из кеша), onload может не сработать
                // Проверяем это и вызываем обработчик вручную
                if (loadingCover.complete && loadingCover.naturalWidth > 0) {
                    // Используем setTimeout, чтобы гарантировать, что onload установлен и loadId актуален
                    setTimeout(() => {
                        // Проверяем, что загрузка все еще актуальна
                        if (activeCoverLoadId === loadId && loadingCover.onload) {
                            loadingCover.onload();
                        }
                    }, 0);
                }
            }
        }

        // Показываем плеер
        player.style.opacity = 1;
        player.classList.add('loaded');
        setStatus("");

        // Запускаем визуализатор если нужно
        if (currentConfig.wave_enabled !== false) {
            animateVisualizer();
        }
    }

    function goToIndex() {
        const player = document.getElementById('player');
        player.style.transition = 'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)';
        player.style.opacity = '0';
        player.style.transform = 'scale(0.95)';

        setTimeout(() => {
            window.location.href = '/index.html';
        }, 300);
    }

    // Улучшенная анимация появления
    document.addEventListener('DOMContentLoaded', function() {
        const player = document.getElementById('player');

        // Начальное состояние
        player.style.opacity = '0';
        player.style.transform = 'scale(1.05)';

        // Анимация через небольшой таймаут для плавности
        setTimeout(() => {
            player.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
            player.style.opacity = '1';
            player.style.transform = 'scale(1)';
        }, 50);
    });

    // WebSocket подключение
    function connect() {
        setStatus("Подключение...");

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

        ws.onopen = () => {
            setStatus("");
        };

        ws.onmessage = (e) => {
            try {
                const data = JSON.parse(e.data);
                console.log('Получены данные:', data);

                if (data.type === 'init' || data.type === 'update') {
                    updatePlayer(data.data);
                    if (data.data.config) {
                        applyConfig(data.data.config);
                    }
                } else if (data.type === 'config_update') {
                    applyConfig(data.config);
                }
            } catch (err) {
                console.error("Ошибка обработки сообщения:", err);
            }
        };

        ws.onclose = () => {
            setStatus("Переподключение...");
            stopVisualizer();
            stopProgressUpdate(progressInterval);
                progressInterval = null;
            reconnect();
        };

        ws.onerror = (err) => {
            console.error("WebSocket error:", err);
            stopVisualizer();
            stopProgressUpdate(progressInterval);
                progressInterval = null;
        };
    }

    function reconnect() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connect, RECONNECT_DELAY);
    }

    // Обработчик клика на прогресс-бар
    progressBar.addEventListener('click', (e) => {
        if (totalDuration > 0) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            currentPosition = percent * totalDuration;
            updateProgress(currentPosition, totalDuration, progress, currentTimeEl, durationEl);

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: "seek",
                    position: currentPosition
                }));
            }
        }
    });

    // Инициализация
    document.addEventListener('DOMContentLoaded', () => {
        createVisualizer(visualizer, 30);
        connect();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                stopVisualizer();
                stopProgressUpdate(progressInterval);
                progressInterval = null;
            } else {
                if (ws && ws.readyState === WebSocket.OPEN && currentConfig.wave_enabled !== false) {
                    animateVisualizer();
                }
                if (isPlaying) {
                    // Останавливаем предыдущий интервал перед созданием нового
                    if (progressInterval) {
                        stopProgressUpdate(progressInterval);
                        progressInterval = null;
                    }
                    const state = { currentPosition, totalDuration, isPlaying };
                    progressInterval = startProgressUpdate(state, () => {
                        currentPosition = state.currentPosition;
                        updateProgress(currentPosition, totalDuration, progress, currentTimeEl, durationEl);
                    });
                }
            }
        });
    });
    </script>
</body>
